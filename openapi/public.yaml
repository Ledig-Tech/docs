            headers["Idempotency-Key"] = required("LEDIG_IDEMPOTENCY_KEY");
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const payload = `${timestamp}.${method}.${pathWithQuery}.${rawBody}`;
            headers["x-ledig-key"] = required("LEDIG_API_KEY");
            headers["x-ledig-timestamp"] = timestamp;
            headers["x-ledig-signature"] = "v1=" + createHmac("sha256", required("LEDIG_API_SECRET"))
