                  type: string
                  enum:
                    - fiat
                    - crypto
                    - ledig
            payoutDetails:
              type: object
              additionalProperties: false
              properties:
                feeAmount:
                  type: string
                feeCurrency:
                  type: string
                payoutFeeSourceAmount:
                  type: string
                payoutFeeSourceCurrency:
                  type: string
                transactionHash:
                  type: string
                processingState:
                  type: string
                  enum:
                    - awaiting_processing
                    - processing
    TransferCustomerPresentation:
      type: object
      additionalProperties: false
      required:
        - status
        - label
        - message
        - actionRequired
      properties:
        status:
          type: string
          enum:
            - awaiting_processing
            - processing
            - completed
            - failed
            - returned
            - action_required
        label:
          type: string
        message:
          type: string
        actionRequired:
          type: boolean
    ClientBalanceImpact:
      type: object
      additionalProperties: false
      description: Customer financial effect derived from Ledger entries, independently of processing status.
      required:
        - state
        - lines
      properties:
        state:
          type: string
          enum:
            - not_started
            - on_hold
            - deducted
            - hold_released
            - returned
            - still_checking
            - return_pending
            - finishing_completion
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - currency
              - amount
              - state
            properties:
              code:
                type: string
                enum:
                  - principal
                  - transfer_fee
                  - conversion_fee
                  - converted_principal
              currency:
                type: string
              amount:
                type: string
              state:
                type: string
                enum:
                  - no_effect
                  - reserved
                  - settled
                  - released
                  - returned
                  - late_settled
                  - pending_finalization
                  - pending_return
                  - unknown
    ClientTransactionData:
      type: object
      additionalProperties: false
      description: Explicit customer history details retained across deposit, payout and off-platform records. Unknown stored data and provider costs are excluded.
      properties:
        sourceType:
          type: string
        source_type:
          type: string
        sourceId:
          type: string
        recordKind:
          type: string
        id:
          type: string
        status:
          type: string
        rate:
          type: string
        sourceAmount:
          type: string
        sourceDebitAmount:
          type: string
        grossAmount:
          type: string
        netAmount:
          type: string
        fee:
          type: string
        feeAmount:
          type: string
        feeCurrency:
          type: string
        fromCurrency:
          type: string
        toCurrency:
          type: string
        destinationAmount:
          type: string
        pair:
          type: string
        baseCurrency:
          type: string
        quoteCurrency:
          type: string
        direction:
          type: string
        selectedSide:
          type: string
        bid:
          type: string
        ask:
          type: string
        agreedRate:
          type: string
        rateConvention:
          type: string
        calculatedDestinationAmount:
          type: string
        tradeDate:
          type: string
        completedAt:
          type: string
        receiptUrl:
          type: string
        affectsBalance:
          type: boolean
        settlement:
          type: object
          additionalProperties: false
          properties:
            method:
              type: string
            reference:
              type: string
            transactionHash:
              type: string
            network:
              type: string
            evidenceIds:
              type: array
              items:
                type: string
              description: Customer-downloadable settlement document references, not compliance evidence.
    PayoutCustomerFeeTermsAvailable:
      type: object
      additionalProperties: false
      required:
        - status
        - feeCurrency
        - terms
        - effectiveFrom
        - validUntil
      properties:
        status:
          type: string
          const: available
        feeCurrency:
          type: string
        terms:
          $ref: "#/components/schemas/PayoutCustomerFeeTerms"
        effectiveFrom:
          type: string
          format: date-time
        validUntil:
          type:
            - string
            - "null"
          format: date-time
          description: Earliest applicable expiry or future policy change; null when no scheduled boundary is known.
    PayoutCustomerFeeTerms:
      type: object
      additionalProperties: false
      required:
        - fixedFee
        - feeBps
        - minimumFee
        - maximumFee
      description: Current authoritative customer policy. The engine combines fixed and principal basis-point fees, applies bounds, applies the selected business adjustment once, then reapplies bounds and rounds once. Use the estimate API for the final amount; do not flatten these terms into a new formula.
      properties:
        fixedFee:
          type: string
        feeBps:
          type: integer
          minimum: 0
          maximum: 10000
        minimumFee:
          type:
            - string
            - "null"
        maximumFee:
          type:
            - string
            - "null"
        adjustment:
          type: object
          additionalProperties: false
          required:
            - type
            - unit
            - value
          properties:
            type:
              type: string
              enum:
                - markup
                - markdown
            unit:
              type: string
              enum:
                - percentage
                - fixed
            value:
              type: string
  responses:
    Unauthorized:
      description: Missing, invalid or expired credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Inactive account, missing profile or missing scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Version conflict or duplicate resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: A request or new-work allowance is exhausted. Wait before retrying; preserve the same idempotency key for a write.
      headers:
        Retry-After:
          description: Seconds until the exhausted allowance can be retried.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          description: Application responses use private, no-store; AWS edge responses use no-store.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: An authoritative dependency (database or provider) is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidOnboardingDocument:
      description: The actual file is unreadable, mislabeled, protected or exceeds validation complexity limits. Returns BAD_REQUEST with a safe message and details validationCode/reasonCode, retryable=false, documentId and requirementType. Replace that file; automatic retry is disabled. Previous retained documents remain unchanged.
      headers:
        x-onboarding-committed-revision:
          description: Optional quoted application revision committed by this exact versioned document-completion or submission request when retaining its safe validation failure. Clients may acknowledge it only for the matching document-completion or submission 422 and must preserve unrelated unsaved answers. It is not a revision from a later read and is absent for conflicts, outages and unversioned legacy requests.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    SelectedBusinessId:
      in: header
      name: X-Ledig-Business-Id
      required: false
      description: Effective direct or managed standard business. Delegation is checked against the authenticated institution and requires HMAC v2 for API keys. Never inferred from a request body.
      schema:
        type: string
        minLength: 1
    ActingBusinessId:
      in: header
      name: X-Ledig-Acting-Business-Id
      required: false
      description: Verified actor institution for selection. Must be a current bearer membership or the API key's owner. HMAC v2 signs the exact trimmed value or empty string when omitted.
      schema:
        type: string
        minLength: 1
    OnboardingSection:
      in: path
      name: section
      required: true
      schema:
        type: string
        enum:
          - company
          - activity
          - ownership
          - regulation
          - documents
          - review
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      description: Required on state-changing requests that call a provider or post to the ledger.
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum:
          - asc
          - desc
    SelectedProfileId:
      in: header
      name: X-Ledig-Profile-Id
      required: false
      description: Existing legacy profile selector. A managed-standard request must omit it or set it equal to X-Ledig-Business-Id; v2 includes it in the signed payload.
      schema:
        type: string
        minLength: 1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "User access JWT from login/refresh. Send as `Authorization: Bearer <accessToken>`."
    LedigApiKey:
      type: apiKey
      in: header
      name: x-ledig-key
      description: Public business API-key identifier.
    LedigSignature:
      type: apiKey
      in: header
      name: x-ledig-signature
      description: HMAC-SHA256 signature prefixed with v1= for existing own-business/legacy selection, or v2= for header-bound managed-business delegation. See the Authentication section for exact canonical payloads.
    LedigTimestamp:
      type: apiKey
      in: header
      name: x-ledig-timestamp
      description: Current Unix timestamp in seconds.
