                  value:
                    status: error
                    code: PAYOUT_MONTHLY_LIMIT_EXCEEDED
                    message: This payment exceeds your account remaining monthly allowance, measured in USD equivalent.
        "423":
          description: "COMPLIANCE_REVIEW_REQUIRED: this payment needs review before it can proceed. Check its status or contact support@ledig.io."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                code: COMPLIANCE_REVIEW_REQUIRED
                message: This action requires a review before it can continue.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: A service required to start the payment is temporarily unavailable. RATE_AUTHORITATIVE_STORE_UNAVAILABLE means the USD equivalent needed to check your payment allowance could not be calculated; the transfer is not created and the quote remains unused.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
                    type: string
                    const: error
                  code:
                    type: string
                  message:
                    type: string
              example:
