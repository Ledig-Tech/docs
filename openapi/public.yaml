            $ref: "#/components/schemas/NetworkReceivingWallet"
        setupState:
          type: string
          enum:
            - processing
            - review_required
          description: More detail for a pending setup. processing means keep checking the same request. review_required means contact support@ledig.io with requestId; repeated checks will not resolve it. Omitted when ready, and may be absent on some pending responses.
