        code:
          type: string
        details:
          description: "Only reviewed remediation details are public: onboarding validation for422 BAD_REQUEST, current_password_incorrect for400 BAD_REQUEST, or the caller’s conversion allowance for409 INSTANT_CONVERSION_LIMIT_EXCEEDED. General exception, provider and compliance review details are never serialized."
          oneOf:
            - type: object
