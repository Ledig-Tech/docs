          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: IDEMPOTENCY_CONFLICT when quote and reference identify different existing transfers. No replacement quote is consumed. INSTANT_CONVERSION_LIMIT_EXCEEDED preserves the caller’s safe daily/monthly allowance details; a new eligible quote may be needed after the original request outcome is resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
