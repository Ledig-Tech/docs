        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transfers:read
      x-mint:
        content: |-
          **Required scope:** `transfers:read`

          Returns one transfer with its current status and a customer-safe `failureReason`. Poll this route to follow execution. A payout may also carry an `approval` state while it waits for review. There is no list route; use transactions for history.
  /v1/transactions:
    get:
      tags:
        - Transactions
      operationId: listTransactions
      summary: List transactions
      description: Reads the customer transaction history.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - in: query
          name: status
          schema:
            type: string
          description: Underlying financial status.
        - in: query
          name: displayStatus
          schema:
            type: string
          description: Current customer display status; filters before pagination.
        - in: query
          name: currency
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: reference
          schema:
            type: string
        - in: query
          name: isCredit
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - in: query
          name: isFiat
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - in: query
          name: period
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - 1y
        - in: query
          name: from
          schema:
            type: string
        - in: query
          name: to
          schema:
            type: string
      responses:
        "200":
          description: Transaction page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ClientTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transactions:read
      x-mint:
        content: |-
          **Required scope:** `transactions:read`

          Returns the profile's customer transaction history. Filter by status, currency, category, type, reference, direction (`isCredit`) or rail (`isFiat`), or use `period`/`from`/`to`. Results are cursor-paginated. Amounts are decimal strings and `isCredit` gives the direction.
  /v1/transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Transactions
      operationId: getTransaction
      summary: Get a transaction
      description: Reads one customer transaction.
      responses:
        "200":
          description: Transaction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ClientTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transactions:read
      x-mint:
        content: |-
          **Required scope:** `transactions:read`

          Returns one customer transaction. Use it after a transfer to read the customer-facing record. Ledger references and internal versions are not part of the public contract.
