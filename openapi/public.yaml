                  value:
                    status: error
                    code: PROVIDER_UNAVAILABLE
                    message: The amount sent to the recipient is outside the limits for this payout method or network. Check the payout limits in the recipient's currency.
      x-scope: quotes:write
      x-mint:
        content: |-
          **Required scope:** `quotes:write`

          Send sourceAmount; Ledig calculates destinationAmount. For a same-currency payment, include payOut. payIn with temporary_bank_account is not supported and returns 501. A quote can be used once through POST /v1/transfers. Check conversion limits in GET /v1/liquidity/routes, measured in the source currency, and payout limits in GET /v1/payouts/catalogue, measured in the destination currency. Quote creation checks the amount, current availability and your source balance including fees. Handle 404 RATE_NOT_FOUND, 422 RATE_ROUTE_AMOUNT_OUT_OF_RANGE and 409 INSUFFICIENT_BALANCE separately. Your business's per-payment and monthly payout allowances are separate limits measured in USD equivalent and are checked when you create the transfer. Both new and replayed responses use HTTP 201: replayed=false means a new quote, and replayed=true returns the original quote for the same reference without renewing its expiry. An expired or accepted quote may be returned by a replay; use a fresh reference when you deliberately request a fresh quote. This endpoint does not use Idempotency-Key.
