          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transactions:read
      x-mint:
        content: |-
          **Required scope:** `transactions:read`

          Returns the profile's customer transaction history. Filter by status, currency, category, type, reference, direction (`isCredit`) or rail (`isFiat`), or use `period`/`from`/`to`. Results are cursor-paginated. Amounts are decimal strings and `isCredit` gives the direction.
  /v1/transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Transactions
      operationId: getTransaction
      summary: Get a transaction
      description: Reads one customer transaction.
      responses:
        "200":
          description: Transaction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transactions:read
      x-mint:
        content: |-
          **Required scope:** `transactions:read`

          Returns one customer transaction. Use it after a transfer to read the customer-facing record. Ledger references and internal versions are not part of the public contract.
components:
  schemas:
    Success:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: success
        message:
          type: string
    CurrencyCatalogEntry:
      type: object
      additionalProperties: true
      description: Currency catalogue entry with its supported networks.
      required:
        - code
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - fiat
            - crypto
        status:
          type: string
        description:
          type:
            - string
            - "null"
        decimal:
          type:
            - integer
            - "null"
        addressRegex:
          type:
            - string
            - "null"
        networks:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - chain
            properties:
              chain:
                type: string
              name:
                type: string
              addressRegex:
                type:
                  - string
                  - "null"
              status:
                type: string
    IndicativeRate:
      type: object
      additionalProperties: false
      description: Indicative rate row in the compatibility shape.
      required:
        - Base Currency
        - Quote Currency
        - Bid
        - Ask
        - "Last Updated "
      properties:
        Base Currency:
          type: string
        Quote Currency:
          type: string
        Bid:
          type: number
        Ask:
          type: number
        "Last Updated ":
          type: string
    Balance:
      type: object
      additionalProperties: true
      description: Ledger balance for one currency.
      required:
        - currency
      properties:
        currency:
          type: string
        available:
          type: string
        reserved:
          type: string
    Wallet:
      type: object
      additionalProperties: true
      description: Crypto deposit address.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        nickname:
          type: string
        coin:
          type: string
        network:
          type: string
        address:
          type: string
        memo:
          type:
            - string
            - "null"
        createdAt:
          type: string
    VirtualAccount:
      type: object
      additionalProperties: true
      description: Fiat receiving account.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        currencyCode:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        bankCode:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        createdAt:
          type: string
        updatedAt:
          type: string
    CreateRecipientRequest:
      type: object
      additionalProperties: false
      required:
        - currency
        - country
        - type
      properties:
        currency:
          type: string
        country:
          type: string
        type:
          type: string
        fields:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
        legalEntityType:
          type: string
        oneTime:
          type: boolean
    Recipient:
      type: object
      additionalProperties: true
      description: Saved payout destination.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        currency:
          type: string
        country:
          type: string
        type:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        reviewStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - revoked
          description: Review state for this saved destination. Approval applies only to its current destination version.
        createdAt:
          type: string
        updatedAt:
          type: string
        active:
          type: boolean
        oneTime:
          type: boolean
    CursorPage:
      allOf:
        - $ref: "#/components/schemas/Success"
        - type: object
          required:
            - data
            - pagination
          properties:
            pagination:
              type: object
              properties:
                nextCursor:
                  type: string
                previousCursor:
                  type: string
    PaymentOption:
      type: object
      additionalProperties: false
      required:
        - channel
        - name
        - description
        - currency
        - paymentMethodIds
        - minimumFee
        - maximumFee
        - minimumAmount
        - maximumAmount
        - supportConversion
      properties:
        channel:
          type: string
        name:
          type: string
        description:
          type: string
        currency:
          type: string
        paymentMethodIds:
          type: array
          items:
            type: string
        minimumFee:
          type: string
        maximumFee:
          type: string
        minimumAmount:
          type: string
        maximumAmount:
          type: string
        supportConversion:
          type: boolean
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - sourceCurrency
        - destinationCurrency
        - sourceAmount
      properties:
        reference:
          type: string
          maxLength: 64
        sourceCurrency:
          type: string
          minLength: 2
          maxLength: 20
        destinationCurrency:
          type: string
          minLength: 2
          maxLength: 20
        sourceAmount:
          type: string
        payIn:
          type: object
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              const: temporary_bank_account
        payOut:
          type: object
          additionalProperties: false
          required:
            - type
            - recipientId
            - paymentMethodId
          properties:
            type:
              type: string
              enum:
                - fiat
                - crypto
            recipientId:
              type: string
            paymentMethodId:
              type: string
            chain:
              type: string
            narration:
              type: string
            transferPurpose:
              type: string
              minLength: 1
              maxLength: 100
              description: Optional transaction purpose. The selected provider validates allowed values and requires it for applicable routes; it is not recipient or sender identity.
    Quote:
      type: object
      additionalProperties: true
      description: Executable pricing terms and expiry.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        sourceCurrency:
          type: string
        destinationCurrency:
          type: string
        sourceAmount:
          type: string
        destinationAmount:
          type: string
        rate:
          type: string
        expiresAt:
          type: string
        status:
          type: string
        reference:
          type: string
        createdAt:
          type: string
    Transfer:
      type: object
      additionalProperties: true
      description: Transfer execution record and status.
      required:
        - id
      properties:
        approval:
          type:
            - object
            - "null"
          additionalProperties: false
          description: Payout review status returned by transfer detail when applicable. The reason is customer-safe; internal staff decisions and identities are not exposed.
          required:
            - status
            - version
            - reason
          properties:
            status:
              type: string
              enum:
                - pending
                - approved
                - rejected
                - expired
                - executing
            version:
              type: integer
              minimum: 1
            reason:
              type:
                - string
                - "null"
        id:
          type: string
        profileId:
          type: string
        quoteId:
          type: string
        status:
          type: string
        reference:
          type: string
        createdAt:
          type: string
        sourceCurrency:
          type: string
        destinationCurrency:
          type: string
        sourceAmount:
          type: string
        destinationAmount:
          type: string
        rate:
          type: string
        failureReason:
          type:
            - string
            - "null"
        updatedAt:
          type: string
    Transaction:
      type: object
      additionalProperties: true
      description: Customer transaction record.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        type:
          type: string
        status:
          type: string
        amount:
          type: string
        currency:
          type: string
        reference:
          type: string
        createdAt:
          type: string
        category:
          type: string
        description:
          type: string
        isCredit:
          type: boolean
        isFiat:
          type: boolean
    Error:
      type: object
      required:
        - status
        - message
        - code
      properties:
        status:
          type: string
          const: error
        message:
          type: string
        code:
          type: string
  responses:
    Unauthorized:
      description: Missing, invalid or expired credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Inactive account, missing profile or missing scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: A request or new-work allowance is exhausted. Wait before retrying; preserve the same idempotency key for a write.
      headers:
        Retry-After:
          description: Seconds until the exhausted allowance can be retried.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          description: Application responses use private, no-store; AWS edge responses use no-store.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: An authoritative dependency (database or provider) is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      description: Required on state-changing requests that call a provider or post to the ledger.
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum:
          - asc
          - desc
  securitySchemes:
    LedigApiKey:
      type: apiKey
      in: header
      name: x-ledig-key
      description: Public business API-key identifier.
    LedigTimestamp:
      type: apiKey
      in: header
      name: x-ledig-timestamp
      description: Current Unix timestamp in seconds.
    LedigSignature:
      type: apiKey
      in: header
      name: x-ledig-signature
      description: Ledig v1 HMAC-SHA256 signature prefixed with `v1=`.
