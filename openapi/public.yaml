                code: RATE_AUTHORITATIVE_STORE_UNAVAILABLE
                message: A current indicative USD valuation is unavailable.
      x-scope: transfers:write
      x-mint:
        content: |-
          **Required scope:** `transfers:write`

          For a new transfer, use a pending, unexpired quote belonging to your business and keep enough available funds to cover it. This endpoint does not use Idempotency-Key. Save the quoteId and any reference you sent. After a timeout, retry with those same values and a fresh signature and timestamp. Once your credentials and business access are checked, a retry matching an existing quoteId or reference returns the original transfer. A reused reference with a new quoteId returns the original transfer and leaves the new quote unused. A reused quoteId with a new reference returns the original transfer without saving the new reference. If quoteId and reference identify different existing transfers, the response is 409 IDEMPOTENCY_CONFLICT. Concurrent retries do not create another transfer. A new quoteId with an unused reference, or without a reference, starts a new request. HTTP 201 means the request was accepted, not that funds were delivered. replayed=false identifies a new transfer; replayed=true identifies the original transfer returned without another payment. Follow GET /v1/transfers/{id} for the current outcome.
      x-codeSamples:
        - lang: javascript
          label: Node.js
          source: |-
            import { createHmac } from "node:crypto";

            // Node.js 18+. Set credentials and resource values on your server.
            function required(name) {
              const value = process.env[name];
              if (!value) throw new Error(`Set ${name} before running this example.`);
              return value;
            }

            const baseUrl = process.env.LEDIG_API_BASE_URL ?? "https://api-sandbox.ledig.io";
            const method = "POST";
            const path = `/v1/transfers`;
            const pathWithQuery = path;
            const body = {
              "quoteId": required("LEDIG_QUOTE_ID"),
              "reference": required("LEDIG_REFERENCE")
            };
            const rawBody = JSON.stringify(body);
            const headers = { "Accept": "application/json" };
            headers["Content-Type"] = "application/json";
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const payload = `${timestamp}.${method}.${pathWithQuery}.${rawBody}`;
            headers["x-ledig-key"] = required("LEDIG_API_KEY");
            headers["x-ledig-timestamp"] = timestamp;
            headers["x-ledig-signature"] = "v1=" + createHmac("sha256", required("LEDIG_API_SECRET"))
              .update(payload).digest("base64");

            const response = await fetch(`${baseUrl}${pathWithQuery}`, {
              method,
              headers,
              body: rawBody,
            });
            const result = await response.json();
            // Use result in your application; do not log credentials or upload links.
            console.log(response.status);
