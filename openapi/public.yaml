        - if:
            properties:
              type:
                enum:
                  - crypto_address
                  - crypto
            required:
              - type
          else:
            required:
              - currency
        - if:
            properties:
              type:
                enum:
                  - ledig
                  - crypto_address
                  - crypto
            required:
              - type
          else:
            required:
              - country
            properties:
              country:
                type: string
                minLength: 1
      properties:
        currency:
          type: string
          minLength: 1
          description: May be omitted for crypto_address or crypto. If supplied, the asset must be supported on the chosen network. Required for bank and mobile money recipients.
        country:
          type: string
          description: May be omitted for crypto_address, crypto or ledig. Crypto recipients default to an empty country because their destination is identified by the network.
        type:
          type: string
          description: The destination requirement ID. Both crypto_address and crypto select a crypto wallet recipient.
        fields:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
        legalEntityType:
          type: string
          enum:
            - individual
            - business
          description: Required for applicable non-ZAR bank and mobile money recipients. For an individual, fields needs firstName and lastName; middleName is optional. For a business, fields needs businessName.
        bankDetailsSource:
          type: string
          enum:
            - directory
            - manual
          description: Manual bank details are accepted only when the recipient requirements offer that choice. Request payment options for this recipient and use one of the returned methods. ZAR does not support manual bank entry.
