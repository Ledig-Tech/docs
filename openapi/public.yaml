        - paymentMethodId
        - currency
        - available
      properties:
        paymentMethodId:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          type: string
        chain:
          type: string
          minLength: 1
          maxLength: 100
        available:
          type: boolean
        reason:
          type: string
          enum:
            - payout_amount_out_of_range
            - payout_amount_unavailable
            - recipient_incompatible
            - network_unavailable
            - payout_unavailable
          description: A reason explaining why the selected payment method is available or unavailable.
        requested:
          type: string
        minimumAmount:
          type: string
        maximumAmount:
          type:
            - string
            - "null"
        amountBands:
          type: array
          description: Supported payout amount bands when the requested amount is outside the limits or falls in a gap. Other availability reasons may omit this field.
          items:
            $ref: "#/components/schemas/PayoutAmountBand"
      description: Availability of the selected payout method. Amount limits use the destination currency; conversion limits are separate. Availability is checked again when you send.
    PaymentOption:
      type: object
      additionalProperties: false
      required:
        - channel
        - name
        - description
        - currency
        - paymentMethodIds
        - minimumFee
        - maximumFee
        - minimumAmount
        - maximumAmount
        - supportConversion
        - invoiceRequired
      properties:
        channel:
          type: string
        name:
          type: string
        description:
          type: string
        currency:
          type: string
        paymentMethodIds:
          type: array
          items:
            type: string
        minimumFee:
          type: string
        maximumFee:
          type: string
        minimumAmount:
          type: string
        maximumAmount:
          type:
            - string
            - "null"
          description: The outer maximum payout amount. For external payouts, check amountBands because intermediate gaps remain unsupported. Null means no maximum.
        amountBands:
          type: array
          description: Supported amount ranges for external payouts in the destination currency. Keep gaps between ranges unsupported. Omitted for deposit and Ledig network options.
          items:
            $ref: "#/components/schemas/PayoutAmountBand"
        supportConversion:
          type: boolean
        executionMode:
          type: string
          enum:
            - provider
            - ledig
          description: How the payout will be sent. For a recipient entered with manual bank details, choose an eligible option returned for that recipient with executionMode=ledig. This requirement is checked again when you send.
        invoiceRequired:
          type: boolean
          default: false
          description: Whether every method in this option requires an invoice. This does not make transferPurpose required.
        feeQuoteRequired:
          type: boolean
          description: True when a fee cannot yet be shown for this option. Create a quote to confirm the fee before sending.
        deliveryOptions:
          type: array
          description: Use these choices when building your payment selection. Empty means no suitable single payment choice is available. Existing names and paymentMethodIds remain accepted. Recipient types identify type categories, not requirement IDs.
          items:
            type: object
            additionalProperties: false
            required:
              - paymentMethodId
              - channel
              - label
              - recipientTypes
            properties:
              paymentMethodId:
                type: string
              channel:
                type: string
              label:
                type: string
                description: A label for your payment screen. The ledig choice is shown as Send via the Ledig network. Changing the label does not change its ID.
              description:
                type: string
                maxLength: 160
                description: Optional help text for a payment choice, such as Send to another Ledig business using its business ID.
              chain:
                type: string
                description: Send this exact value when creating a quote. Use feeChain separately to match fee rows.
              canonicalNetwork:
                type: string
                description: The network ID to match against the recipient's destinationScope.network. Main networks and test networks have different IDs.
              networkName:
                type: string
              recipientTypes:
                type: array
                items:
                  type: string
              feeChain:
                type: string
                description: The network value used to match fee rows. It may differ from chain; do not send it in place of chain when creating a quote.
              testnet:
                type: boolean
        feeQuotes:
          type: array
          description: Estimated fees for this business and payment method. Create a quote to confirm the final terms.
          items:
            type: object
            additionalProperties: false
            required:
              - paymentMethodId
              - feeAmount
              - feeCurrency
            properties:
              paymentMethodId:
                type: string
              feeAmount:
                type: string
              feeCurrency:
                type: string
              chain:
                type: string
    PayoutFeeCatalogue:
