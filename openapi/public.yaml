        - methodName
        - feeDescription
      properties:
        id:
          type: string
          description: Stable customer display key, not a payment method instruction.
        currency:
          type: string
        payoutType:
          type: string
          enum:
            - fiat
            - crypto
            - ledig
        methodName:
          type: string
        networkName:
          type: string
