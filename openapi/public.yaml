              schema:
                $ref: "#/components/schemas/PayoutUsdLimitExceededError"
              examples:
                transactionLimit:
                  value:
                    status: error
                    code: PAYOUT_TRANSACTION_LIMIT_EXCEEDED
                    message: This payout exceeds the business transaction limit.
                monthlyLimit:
                  value:
                    status: error
                    code: PAYOUT_MONTHLY_LIMIT_EXCEEDED
                    message: This payout exceeds the business monthly allowance.
        "423":
          description: "COMPLIANCE_REVIEW_REQUIRED: the requested payment is held for review. No private review or provider detail is returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: A required provider, policy store or indicative rate is unavailable. RATE_AUTHORITATIVE_STORE_UNAVAILABLE means a usable USD admission valuation could not be established; no transfer or quote claim is committed by a failed admission.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
                    type: string
                    const: error
                  code:
                    type: string
                  message:
                    type: string
              example:
                status: error
                code: RATE_AUTHORITATIVE_STORE_UNAVAILABLE
                message: A current indicative USD valuation is unavailable.
      x-scope: transfers:write
      x-mint:
        content: |-
          **Required scope:** `transfers:write`

          Executes a quote. For a new transfer, the quote must be pending, unexpired and owned by the profile, and the source balance must cover the amount. There is no Idempotency-Key header on this route. Retain the same quoteId and any original reference, and retry with a fresh signature and timestamp. After authentication, request validation and active-business checks, an existing transfer matching the quoteId or explicit reference within the same financial profile is returned before quote acceptance, balance checks and payout admission. A reused reference with a fresh quoteId returns the original transfer and leaves the fresh quote untouched. A reused quoteId with a new unclaimed reference returns the original transfer without adding a reference alias. If the quoteId and reference identify different existing transfers, the request returns 409 IDEMPOTENCY_CONFLICT. Concurrent requests for the same quote or reference are serialized; retries do not create another transfer or dispatch. A new quoteId with an unused reference, or with no reference, is a new request.
