            - type: "null"
        estimatedReservedUsd:
          anyOf:
            - type: string
              pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Signed estimated USD value, rounded to cents.
            - type: "null"
        valuedSubtotalUsd:
          type: object
          additionalProperties: false
