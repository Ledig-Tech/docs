                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ClientQuote"
        "400":
          description: Invalid request, unsupported amount precision or invalid provider mobile network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                amountPrecision:
                  summary: A zero-decimal currency received a non-zero fractional amount.
                  value:
                    status: error
                    code: BAD_REQUEST
                    message: Amount exceeds the currency's 0-decimal precision.
                mobileNetwork:
                  summary: Illustrative accepted values; the actual list comes from the country's provider catalogue.
                  value:
                    status: error
                    code: PROVIDER_NETWORK_INVALID
                    message: "Mobile-money network is invalid for KE. Accepted values: Mpesa."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The selected provider conversion route is unavailable. Missing adapters, fresh capacity or required execution policy fail closed; no fallback global route is substituted. INSTANT_CONVERSION_LIMIT_EXCEEDED preserves the caller’s safe daily/monthly allowance details; a new eligible quote may be needed after the original request outcome is resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                code: RATE_PROVIDER_CONVERSION_UNAVAILABLE
                message: Conversion is not available for this route.
        "423":
          description: "COMPLIANCE_REVIEW_REQUIRED: the requested payment is held for review. No private review or provider detail is returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
