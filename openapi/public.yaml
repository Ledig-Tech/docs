          description: IDEMPOTENCY_CONFLICT means quoteId and reference identify different transfers; the new quote remains unused. INSTANT_CONVERSION_LIMIT_EXCEEDED includes your daily or monthly allowance details. Resolve the original request's outcome before creating a replacement quote.
          content:
