        testnet:
          type: boolean
        supportedAssets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CryptoNetworkAsset"
    CryptoNetworkAsset:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - testToken
      properties:
        code:
          type: string
        name:
          type: string
        testToken:
          type: boolean
          description: When true, use test tokens only. A test token labelled USDT is not Tether-issued USDT.
    NetworkReceivingWallet:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - coin
        - memo
        - nickname
        - network
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        address:
          type: string
        coin:
          type: string
        memo:
          type: string
        nickname:
          type: string
        network:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    ClientFundingInstructions:
      type: object
      additionalProperties: false
      description: Current instructions for adding funds. Include the memorandum whenever these instructions require one.
      properties:
        network:
          type:
            - string
            - "null"
        memorandum:
          type:
            - string
            - "null"
        bicCode:
          type:
            - string
            - "null"
        bankAddress:
          type: object
          additionalProperties: false
          properties:
            fullAddress:
              type:
                - string
                - "null"
            countryCode:
              type:
                - string
                - "null"
            city:
              type:
                - string
                - "null"
            region:
              type:
                - string
                - "null"
            postalCode:
              type:
                - string
                - "null"
        transactionFee:
          type: object
          additionalProperties: false
          properties:
            value:
              type:
                - string
                - "null"
            asset:
              type:
                - string
                - "null"
    PayoutAmountBand:
      type: object
      additionalProperties: false
      required:
        - minimumAmount
        - maximumAmount
      properties:
        minimumAmount:
          type: string
        maximumAmount:
          type:
            - string
            - "null"
    PayoutFeeCatalogueRow:
      type: object
      additionalProperties: false
      required:
        - bandId
        - payoutType
        - currency
        - precision
        - channel
        - label
        - minimumAmount
        - maximumAmount
        - pricing
        - payoutAvailability
      properties:
        bandId:
          type: string
          pattern: ^pbd_[a-f0-9]{32}$
          description: The ID of this fee band. Use it to select a band for a fee estimate; it does not approve a payment.
        payoutType:
          type: string
          enum:
            - fiat
            - crypto
        currency:
          type: string
        precision:
          type: integer
          minimum: 0
          maximum: 18
        channel:
          type: string
        label:
          type: string
        canonicalNetwork:
          type: string
          description: The exact crypto network ID. Absent for bank and mobile money payouts.
        chain:
          type: string
          description: Send this value unchanged when choosing a payment option. Do not substitute another network name or environment.
        networkName:
          type: string
        testnet:
          type: boolean
        testToken:
          type: boolean
        minimumAmount:
          type: string
        maximumAmount:
          type:
            - string
            - "null"
          description: The maximum payout amount. Null means this crypto option has no maximum and its minimum must be zero. Bank and mobile money options have a maximum.
        pricing:
          oneOf:
            - $ref: "#/components/schemas/PayoutCustomerFeeTermsAvailable"
            - $ref: "#/components/schemas/PayoutCustomerFeeUnavailable"
        payoutAvailability:
          $ref: "#/components/schemas/PayoutCatalogueAvailability"
    PayoutCustomerFeeEstimateAvailable:
      type: object
      additionalProperties: false
      required:
        - status
        - feeCurrency
        - terms
        - effectiveFrom
        - validUntil
        - feeAmount
      properties:
        status:
          type: string
          const: available
        feeCurrency:
          type: string
        terms:
          $ref: "#/components/schemas/PayoutCustomerFeeTerms"
        effectiveFrom:
          type: string
          format: date-time
        validUntil:
          type:
            - string
            - "null"
          format: date-time
        feeAmount:
          type: string
          description: The calculated payout fee for this estimate. A value of zero is a valid fee.
    PayoutCustomerFeeUnavailable:
      type: object
      additionalProperties: false
      required:
        - status
        - reasonCode
      properties:
        status:
          type: string
          const: unavailable
        reasonCode:
          type: string
          enum:
            - pricing_unavailable
            - ambiguous_scope
            - scope_unavailable
    PayoutCatalogueAvailability:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - reasonCode
          properties:
            status:
              type: string
              const: available
            reasonCode:
              type: string
              const: ready_for_quote
        - type: object
          additionalProperties: false
          required:
            - status
            - reasonCode
          properties:
            status:
              type: string
              const: unknown
            reasonCode:
              type: string
              const: availability_unverified
        - type: object
          additionalProperties: false
          required:
            - status
            - reasonCode
          properties:
            status:
              type: string
              const: unavailable
            reasonCode:
              type: string
              enum:
                - payouts_paused
                - amount_outside_limits
                - routing_conflict
                - payout_restricted
                - not_configured
    PayoutDocumentId:
      type: string
      pattern: ^pdoc_[A-Za-z0-9_-]{24}$
      description: The ID of an invoice document uploaded by your business. Supply the ID, not a file URL.
    ClientMoneyMeta:
      type: object
      additionalProperties: false
      description: The pricing and payment instructions accepted for this transaction.
      properties:
        rate:
          type: object
          additionalProperties: false
          required:
            - product
            - sourceCurrency
            - destinationCurrency
            - rate
            - side
            - type
          properties:
            product:
              type: string
            sourceCurrency:
              type: string
            destinationCurrency:
              type: string
            rate:
              type: string
            side:
              type: string
              enum:
                - buy
                - sell
            type:
              type: string
              const: fixed
        payIn:
          type: object
          additionalProperties: false
          description: Receiving instructions accepted for this transaction. New temporary_bank_account requests are not supported.
          required:
            - type
          properties:
            type:
              type: string
              const: temporary_bank_account
        payOut:
          type: object
          additionalProperties: false
          description: The accepted destination and instructions for the payout.
          required:
            - type
            - paymentMethodId
          properties:
            paymentMethodId:
              type: string
            chain:
              type: string
            narration:
              type: string
            transferPurpose:
              type: string
            invoiceDocumentId:
              type: string
            recipientId:
              type: string
            businessId:
              type: string
            businessName:
              type: string
            type:
              type: string
              enum:
                - fiat
                - crypto
                - ledig
    ClientTransferEvent:
      type: object
      additionalProperties: false
      description: A transfer progress update or terminal failure. Use the transfer's status for its current outcome.
      required:
        - eventType
        - sourceId
        - status
        - createdAt
        - updatedAt
        - meta
      properties:
        eventType:
          type: string
          enum:
            - created
            - conversion
            - withdrawal
            - failed
        sourceId:
          type:
            - string
            - "null"
          description: The payout receipt reference for a withdrawal event. Null for created, conversion and failed events.
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        meta:
          type: object
          additionalProperties: false
          properties:
            rate:
              type: object
              additionalProperties: false
              required:
                - product
                - sourceCurrency
                - destinationCurrency
                - rate
                - side
                - type
              properties:
                product:
                  type: string
                sourceCurrency:
                  type: string
                destinationCurrency:
                  type: string
                rate:
                  type: string
                side:
                  type: string
                  enum:
                    - buy
                    - sell
                type:
                  type: string
                  const: fixed
            payIn:
              type: object
              additionalProperties: false
              description: Receiving instructions accepted for this transaction. New temporary_bank_account requests are not supported.
              required:
                - type
              properties:
                type:
                  type: string
                  const: temporary_bank_account
            payOut:
              type: object
              additionalProperties: false
              description: The accepted destination and instructions for the payout.
              required:
                - type
                - paymentMethodId
              properties:
                paymentMethodId:
                  type: string
                chain:
                  type: string
                narration:
                  type: string
                transferPurpose:
                  type: string
                invoiceDocumentId:
                  type: string
                recipientId:
                  type: string
                businessId:
                  type: string
                businessName:
                  type: string
                type:
                  type: string
                  enum:
                    - fiat
                    - crypto
                    - ledig
            payoutDetails:
              type: object
              additionalProperties: false
              properties:
                feeAmount:
                  type: string
                feeCurrency:
                  type: string
                payoutFeeSourceAmount:
                  type: string
                payoutFeeSourceCurrency:
                  type: string
                completionBasis:
                  type: string
                  const: sent_to_bank
                  description: sent_to_bank means the payment has been sent to the banking network. The recipient bank may still be processing the credit. Financial status remains completed.
                transactionHash:
                  type: string
                processingState:
                  type: string
                  enum:
                    - awaiting_processing
                    - processing
    TransferCustomerPresentation:
      type: object
      additionalProperties: false
      required:
        - status
        - label
        - message
        - actionRequired
      properties:
        status:
          type: string
          enum:
            - awaiting_processing
            - processing
            - completed
            - failed
            - returned
            - action_required
        label:
          type: string
        message:
          type: string
        actionRequired:
          type: boolean
    ClientBalanceImpact:
      type: object
      additionalProperties: false
      description: How the transfer affected your balance, shown separately from its processing status.
      required:
        - state
        - lines
      properties:
        state:
          type: string
          enum:
            - not_started
            - on_hold
            - deducted
            - hold_released
            - returned
            - still_checking
            - return_pending
            - finishing_completion
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - currency
              - amount
              - state
            properties:
              code:
                type: string
                enum:
                  - principal
                  - transfer_fee
                  - conversion_fee
                  - converted_principal
              currency:
                type: string
              amount:
                type: string
              state:
                type: string
                enum:
                  - no_effect
                  - reserved
                  - settled
                  - released
                  - returned
                  - late_settled
                  - pending_finalization
                  - pending_return
                  - unknown
    ClientTransactionData:
      type: object
      additionalProperties: false
      description: Details for a deposit, payout or other transaction in your history.
      properties:
        sourceType:
          type: string
        source_type:
          type: string
        sourceId:
          type: string
        recordKind:
          type: string
        id:
          type: string
        status:
          type: string
        rate:
          type: string
        sourceAmount:
          type: string
        sourceDebitAmount:
          type: string
        grossAmount:
          type: string
        netAmount:
          type: string
        fee:
          type: string
        feeAmount:
          type: string
        feeCurrency:
          type: string
        fromCurrency:
          type: string
        toCurrency:
          type: string
        destinationAmount:
          type: string
        pair:
          type: string
        baseCurrency:
          type: string
        quoteCurrency:
          type: string
        direction:
          type: string
        selectedSide:
          type: string
        bid:
          type: string
        ask:
          type: string
        agreedRate:
          type: string
        rateConvention:
          type: string
        calculatedDestinationAmount:
          type: string
        tradeDate:
          type: string
        completedAt:
          type: string
        receiptUrl:
          type: string
        affectsBalance:
          type: boolean
        settlement:
          type: object
          additionalProperties: false
          properties:
            method:
              type: string
            reference:
              type: string
            transactionHash:
              type: string
            network:
              type: string
            evidenceIds:
              type: array
              items:
                type: string
              description: References for settlement documents available for you to download.
    EstimatedUsdRate:
      type: object
      additionalProperties: false
      required:
        - baseCurrency
        - quoteCurrency
        - bid
        - asOf
        - expiresAt
      properties:
        baseCurrency:
          type: string
          const: USD
        quoteCurrency:
          type: string
          pattern: ^[A-Z0-9]{2,12}$
        bid:
          type: string
          pattern: ^(?!0(?:\.0+)?$)(?:0|[1-9]\d{0,39})(?:\.\d{1,18})?$
          description: An indicative bid for the returned baseCurrency/quoteCurrency pair, with up to 18 decimal places. Create a quote for an executable rate.
        asOf:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
    PayoutCustomerFeeTermsAvailable:
      type: object
      additionalProperties: false
      required:
        - status
        - feeCurrency
        - terms
        - effectiveFrom
        - validUntil
      properties:
        status:
          type: string
          const: available
        feeCurrency:
          type: string
        terms:
          $ref: "#/components/schemas/PayoutCustomerFeeTerms"
        effectiveFrom:
          type: string
          format: date-time
        validUntil:
          type:
            - string
            - "null"
          format: date-time
          description: The earliest time these fee terms are scheduled to expire or change. Null means no scheduled change is known.
    PayoutCustomerFeeTerms:
      type: object
      additionalProperties: false
      required:
        - fixedFee
        - feeBps
        - minimumFee
        - maximumFee
      description: Your current fee terms. The fee combines fixed and amount-based charges, applies the minimum and maximum, applies your business adjustment once, reapplies the limits and rounds once. Use the fee estimate endpoint for the final amount rather than calculating it yourself.
      properties:
        fixedFee:
          type: string
        feeBps:
          type: integer
          minimum: 0
          maximum: 10000
        minimumFee:
          type:
            - string
            - "null"
        maximumFee:
          type:
            - string
            - "null"
        adjustment:
          type: object
          additionalProperties: false
          required:
            - type
            - unit
            - value
          properties:
            type:
              type: string
              enum:
                - markup
                - markdown
            unit:
              type: string
              enum:
                - percentage
                - fixed
            value:
              type: string
  responses:
    Unauthorized:
      description: Authentication is missing, invalid or expired. Check your credentials and request signature.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: UNAUTHORIZED
            message: Authentication is required.
    Forbidden:
      description: Your account is inactive, the business selection is missing, or your credentials do not have the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: FORBIDDEN
            message: You do not have permission to perform this action.
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: NOT_FOUND
            message: The requested resource was not found.
    Conflict:
      description: The request conflicts with an existing resource or a newer saved version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: CONFLICT
            message: The request conflicts with the current state of this resource.
    BadRequest:
      description: The request is invalid. Check the error message and submitted fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: BAD_REQUEST
            message: Check the request fields and try again.
    RateLimited:
      description: A request or operation allowance has been reached. Wait before retrying. If the endpoint uses an idempotency key, keep the same key for the retry.
      headers:
        Retry-After:
          description: The number of seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          description: Responses use private, no-store or no-store. Do not cache this response.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: RATE_LIMITED
            message: Too many requests. Wait before trying again.
    ServiceUnavailable:
      description: The requested service is temporarily unavailable. Follow the retry guidance for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: PROVIDER_UNAVAILABLE
            message: This service is temporarily unavailable. Please try again later.
    InvalidOnboardingDocument:
      description: The file could not be accepted because it is unreadable, has the wrong type, is password-protected or is too complex to validate. BAD_REQUEST includes validationCode or reasonCode, retryable=false, documentId and requirementType. Replace the file instead of retrying it automatically. Previously accepted documents remain unchanged.
      headers:
        x-onboarding-committed-revision:
          description: When present on a document-completion or submission 422 response, this quoted value is the application's new edit revision for that request. Use it only for the matching failed request and preserve any other unsaved answers. It is absent on conflicts, outages and requests that did not supply a revision.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: error
            code: BAD_REQUEST
            message: The document could not be read. Upload a readable replacement.
            details:
              validationCode: document_unreadable
              reasonCode: document_unreadable
              retryable: false
              documentId: 11111111-1111-4111-8111-111111111111
              requirementType: incorporation_or_registration_evidence
  parameters:
    SelectedBusinessId:
      in: header
      name: X-Ledig-Business-Id
      required: false
      description: The business you are acting for. For a managed business, your institution must be authorised to act for it and API-key requests must use HMAC v2. Set this header explicitly; a business ID in the body does not select the business.
      schema:
        type: string
        minLength: 1
      example: institution_example_001
    ActingBusinessId:
      in: header
      name: X-Ledig-Acting-Business-Id
      required: false
      description: Your institution's business ID when acting for a managed business. It must match your API key's owner or an institution you belong to. HMAC v2 signs the trimmed value, or an empty string when omitted.
      schema:
        type: string
        minLength: 1
      example: institution_example_001
    OnboardingSection:
      in: path
      name: section
      required: true
      schema:
        type: string
        enum:
          - company
          - activity
          - ownership
          - regulation
          - documents
          - review
      example: company
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      description: A unique value for this request. On endpoints that require it, retry with the same key and identical inputs to avoid creating the operation twice.
      example: example-request-001
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
      example: resource_example_001
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      example: eyJpZCI6InRyYW5zYWN0aW9uX2V4YW1wbGVfMDAxIn0
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum:
          - asc
          - desc
      example: desc
    SelectedProfileId:
      in: header
      name: X-Ledig-Profile-Id
      required: false
      description: An optional business selection header supported by existing integrations. For a managed business, omit it or use the same value as X-Ledig-Business-Id. HMAC v2 includes it in the signed request.
      schema:
        type: string
        minLength: 1
      example: institution_example_001
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 20
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "A user access token from sign-in. Send Authorization: Bearer followed by the token. Use this only on endpoints that list BearerAuth."
    LedigApiKey:
      type: apiKey
      in: header
      name: x-ledig-key
      description: Your business API key ID. Keep its secret on your server and use that secret to sign each request.
    LedigSignature:
      type: apiKey
      in: header
      name: x-ledig-signature
      description: The request's HMAC-SHA256 signature. Use the v1= prefix for supported own-business requests, or v2= when acting for a managed business with signed business-selection headers. Follow the authentication guide to construct and sign the exact request.
    LedigTimestamp:
      type: apiKey
      in: header
      name: x-ledig-timestamp
      description: The current Unix timestamp in seconds, used in the signed request.
