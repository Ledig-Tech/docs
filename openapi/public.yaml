        content: |-
          **Required scope:** `fiat_wallet`

          Returns the profile's active fiat receiving account for a currency, creating one if none exists. Use the account number and bank details for customer deposits. Responses are `Cache-Control: no-store`; fetch them when needed and do not cache them. If a previous issuance is still pending, the route returns `409` instead of creating a second account.
  /v1/recipients:
    post:
      tags:
        - Recipients
      operationId: createRecipient
      summary: Create a recipient
      description: Saves a payout destination for review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipientRequest"
      responses:
        "200":
          description: Recipient created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-scope: recipient_manage
      x-mint:
        content: |-
          **Required scope:** `recipient_manage`

          Saves a payout destination. `type` selects the destination requirement (`ngn_bank_transfer`, `brl_bank_transfer` or `crypto_address`) and `fields` carries the corridor-specific values. A new destination is `pending` and cannot be used until approved. When automated screening is enabled, a destination that passes every check may be approved without manual review. Adding a recipient is not approval.
    get:
      tags:
        - Recipients
      operationId: listRecipients
      summary: List recipients
      description: Lists the profile's recipients and their review status.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Recipient page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Recipient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: recipient_read
      x-mint:
        content: |-
          **Required scope:** `recipient_read`

          Lists the profile's recipients with their review status. Use `limit`, `cursor` and `sort`; the response includes `pagination.nextCursor`.
  /v1/recipients/{id}:
    parameters:
