    ClientLiquidityRoute:
      type: object
      additionalProperties: false
      description: A conversion direction with its amount limits, fees, availability and optional rate estimate.
      required:
        - id
        - sourceCurrency
        - destinationCurrency
        - sourceAssetType
        - destinationAssetType
        - minAmount
        - maxAmount
        - feeBps
        - feeCurrency
        - feeMode
        - status
        - availability
      properties:
        id:
          type: string
          description: A conversion reference you can show to support. Do not send it as routeId when creating a quote.
        sourceCurrency:
          type: string
        destinationCurrency:
          type: string
        sourceAssetType:
          type: string
          description: The type of currency being converted, such as crypto or fiat.
        destinationAssetType:
          type: string
          description: The type of currency you will receive, such as crypto or fiat.
        minAmount:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: The smallest amount you can convert, in the source currency.
        maxAmount:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: The largest amount you can convert, in the source currency.
        feeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: The conversion fee in basis points. One basis point is 0.01%; the fee is added to the source amount.
        feeCurrency:
          type: string
          description: The currency of the conversion fee; this matches sourceCurrency.
        feeMode:
          type: string
          const: added_on_top
        status:
          type: string
          enum:
            - active
          description: Whether this conversion direction is enabled. Current pricing, available funds and payment eligibility are checked separately.
        pricing:
          $ref: "#/components/schemas/ClientLiquidityPricing"
        availability:
          type: string
          enum:
            - available
            - unavailable
          description: Whether the conversion is currently available. Create a quote to check your particular amount.
    ClientBalance:
