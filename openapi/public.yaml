        - in: query
          name: currency
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: reference
          schema:
            type: string
        - in: query
          name: isCredit
          schema:
            type: string
