          type: string
          description: Current customer fee formula including fixed and percentage charges, bounds and any applicable fee adjustment. The final quote confirms the amount.
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - sourceCurrency
        - destinationCurrency
        - sourceAmount
      properties:
        reference:
          type: string
          maxLength: 64
        sourceCurrency:
          type: string
          minLength: 2
          maxLength: 20
        destinationCurrency:
          type: string
          minLength: 2
          maxLength: 20
        sourceAmount:
          type: string
          description: Positive decimal amount within sourceCurrency's configured precision. Excess fractional zeroes are accepted; non-zero excess digits are rejected without rounding. Zero-decimal currencies accept 10 or 10.000 but reject 10.1.
        payIn:
          type: object
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              const: temporary_bank_account
        payOut:
          type: object
          additionalProperties: false
          required:
            - type
            - paymentMethodId
          description: External payouts use recipientId. Direct internal transfers use businessId without saving a recipient. Existing internal recipientId requests and legacy recipient creation/discovery remain supported during deprecation; new clients use businessId. Business names and internal execution fingerprints are resolved by the server and are not accepted here.
          oneOf:
            - properties:
                type:
                  enum:
                    - fiat
                    - crypto
              required:
                - recipientId
              not:
                required:
                  - businessId
            - properties:
                type:
                  const: ledig
                paymentMethodId:
                  const: ledig
              required:
                - businessId
              not:
                anyOf:
                  - required:
                      - recipientId
                  - required:
                      - chain
            - deprecated: true
              properties:
                type:
                  const: ledig
                paymentMethodId:
                  const: ledig
              required:
                - recipientId
              not:
                anyOf:
                  - required:
                      - businessId
                  - required:
                      - chain
          properties:
            type:
              type: string
              enum:
                - fiat
                - crypto
                - ledig
            recipientId:
              type: string
            businessId:
              type: string
              minLength: 1
              maxLength: 200
            paymentMethodId:
              type: string
            chain:
              type: string
            narration:
              type: string
            transferPurpose:
              type: string
              minLength: 1
              maxLength: 100
              description: Optional internal Ledig classification. Recommended dropdown values come from GET /v1/quotes/transfer-purposes and include Other. Existing free-text values remain accepted. Provider instruction mapping belongs to the adapter.
            invoiceDocumentId:
              allOf:
                - $ref: "#/components/schemas/PayoutDocumentId"
              description: Optional uploaded invoice reference. Required only when the selected payment option declares invoiceRequired. Must resolve to a verified object owned by the effective financial profile.
