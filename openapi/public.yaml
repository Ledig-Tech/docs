                          $ref: "#/components/schemas/ClientQuote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: quotes:read
      x-mint:
        content: |-
