        id:
          type: string
        profileId:
          type: string
        currencyCode:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        bankCode:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        status:
          type: string
          enum:
