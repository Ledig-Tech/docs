              throw new Error("Use the lowercase SHA-256 checksum of this exact file.");
            if (!Number.isSafeInteger(documentSizeBytes) || documentSizeBytes < 1 || documentSizeBytes > 52428800)
              throw new Error("File size must be a positive integer no greater than 52428800 bytes.");
            const body = {
              requirementType: "incorporation_or_registration_evidence",
              documentKind: "certificate_of_incorporation",
              originalFileName: documentFileName,
              mimeType: documentMimeType,
              checksumSha256: documentChecksum,
              sizeBytes: documentSizeBytes,
