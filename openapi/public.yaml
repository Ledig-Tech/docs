# Generated Ledig payments API reference.
# Changes are managed through the documentation build.

openapi: 3.1.0
info:
  title: Ledig payments API
  version: 0.1.0
  description: |-
    Use the Ledig payments engine to receive funds, view balances, convert currencies and send payments.

    Choose Sandbox to test your integration or Live for production payments. Each endpoint explains the fields, permissions and errors you need to handle.

    Sign API requests with your business API key and HMAC-SHA256. Endpoints listing BearerAuth also accept a user access token. Follow https://docs.ledig.io/auth/authentication to sign your requests.
  contact:
    name: Ledig
    email: support@ledig.io
    url: https://docs.ledig.io
servers:
  - url: https://api-sandbox.ledig.io
    description: Sandbox
  - url: https://api.ledig.io
    description: Live
security:
  - LedigApiKey: []
    LedigTimestamp: []
    LedigSignature: []
tags:
  - name: Managed businesses
    description: Onboarding for businesses you manage.
  - name: System
    description: Health and availability.
  - name: Balances
    description: Your available and reserved funds by currency.
  - name: Currencies and rates
    description: Supported currencies, networks and indicative rates.
  - name: Funding accounts
    description: Fiat accounts that receive customer deposits.
  - name: Deposit wallets
    description: Crypto addresses that receive customer deposits.
  - name: Recipients
    description: Saved payout destinations.
  - name: Ledig businesses
    description: Find a business before paying through the Ledig network.
  - name: Payment options
    description: Available payout methods, fees and limits.
  - name: Quotes
    description: Confirm rates, fees and amounts before sending.
  - name: Transfers
    description: Start and track conversions and payments.
  - name: Transactions
    description: Customer transaction history.
paths:
  /v1/managed-businesses/{businessId}/onboarding/share:
    parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
        example: business_example_001
      - $ref: "#/components/parameters/SelectedBusinessId"
      - $ref: "#/components/parameters/ActingBusinessId"
    get:
      tags:
        - Managed businesses
      operationId: getManagedOnboardingShare
      summary: Check an onboarding link
      description: Check whether a managed business has an active onboarding link.
      security:
        - BearerAuth: []
        - LedigApiKey: []
          LedigTimestamp: []
          LedigSignature: []
      responses:
        "200":
          description: Sharing metadata or null.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Referrer-Policy:
              schema:
                type: string
              description: no-referrer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/ManagedOnboardingShare"
                          - type: "null"
              example:
                status: success
                data:
                  sessionId: 22222222-2222-4222-8222-222222222222
                  expiresAt: 2026-01-15T10:05:00.000Z
                  expired: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: merchants:read
      x-mint:
        content: |-
          **Required scope:** `merchants:read`

          Use your institution's credentials and keep your institution selected in the business headers. The businessId in the path identifies the business whose application you manage. Your institution must have managed-business access and an active relationship with that business. You can complete its application before that business is approved. Returns the link's status and expiry, or null when no active link exists. The link itself is shown only when it is created and cannot be recovered with this request.
      x-codeSamples:
        - lang: javascript
          label: Node.js
          source: |-
            import { createHmac } from "node:crypto";

            // Node.js 18+. Set credentials and resource values on your server.
            function required(name) {
              const value = process.env[name];
              if (!value) throw new Error(`Set ${name} before running this example.`);
              return value;
            }

            const baseUrl = process.env.LEDIG_API_BASE_URL ?? "https://api-sandbox.ledig.io";
            const method = "GET";
            const businessId = required("LEDIG_BUSINESS_ID");
            const path = `/v1/managed-businesses/${encodeURIComponent(businessId)}/onboarding/share`;
            const pathWithQuery = path;
            const rawBody = "";
            const headers = { "Accept": "application/json" };
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const payload = `${timestamp}.${method}.${pathWithQuery}.${rawBody}`;
            headers["x-ledig-key"] = required("LEDIG_API_KEY");
            headers["x-ledig-timestamp"] = timestamp;
            headers["x-ledig-signature"] = "v1=" + createHmac("sha256", required("LEDIG_API_SECRET"))
              .update(payload).digest("base64");

            const response = await fetch(`${baseUrl}${pathWithQuery}`, {
              method,
              headers,
            });
            const result = await response.json();
            // Use result in your application; do not log credentials or upload links.
            console.log(response.status);
    post:
      tags:
        - Managed businesses
      operationId: createManagedOnboardingShare
      summary: Create an onboarding link
      description: Let someone complete a managed business application through a secure link.
      security:
        - BearerAuth: []
        - LedigApiKey: []
          LedigTimestamp: []
          LedigSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                replaceSessionId:
                  type: string
                  format: uuid
            example: {}
      responses:
        "201":
          description: One-time disclosure of the sharing URL.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Referrer-Policy:
              schema:
                type: string
              description: no-referrer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - sessionId
                          - expiresAt
                          - url
                        properties:
                          sessionId:
                            type: string
                            format: uuid
                          expiresAt:
                            type: string
                            format: date-time
                          url:
                            type: string
                            format: uri
              example:
                status: success
                data:
                  sessionId: 22222222-2222-4222-8222-222222222222
                  expiresAt: 2026-01-15T10:05:00.000Z
                  url: https://example.com/onboarding/example-link-not-valid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: merchants:write
      x-mint:
        content: |-
          **Required scope:** `merchants:write`

          Use your institution's credentials and keep your institution selected in the business headers. The businessId in the path identifies the business whose application you manage. Your institution must have managed-business access and an active relationship with that business. You can complete its application before that business is approved. The application must still be editable. Anyone with the link can edit and submit this application, including its documents, without creating an account. The link does not give access to balances, payments or the dashboard and expires after seven days. To replace an active link, first read its status and send replaceSessionId. A missing or outdated replacement ID returns 409. Replacing the link also ends access through the old link. The URL is returned once and is not emailed automatically. Share it only with the intended applicant; do not store it in logs.
      x-codeSamples:
        - lang: javascript
          label: Node.js
          source: |-
            import { createHmac } from "node:crypto";

            // Node.js 18+. Set credentials and resource values on your server.
            function required(name) {
              const value = process.env[name];
              if (!value) throw new Error(`Set ${name} before running this example.`);
              return value;
            }

            const baseUrl = process.env.LEDIG_API_BASE_URL ?? "https://api-sandbox.ledig.io";
            const method = "POST";
            const businessId = required("LEDIG_BUSINESS_ID");
            const path = `/v1/managed-businesses/${encodeURIComponent(businessId)}/onboarding/share`;
            const pathWithQuery = path;
            const body = {};
            const rawBody = JSON.stringify(body);
            const headers = { "Accept": "application/json" };
            headers["Content-Type"] = "application/json";
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const payload = `${timestamp}.${method}.${pathWithQuery}.${rawBody}`;
            headers["x-ledig-key"] = required("LEDIG_API_KEY");
            headers["x-ledig-timestamp"] = timestamp;
            headers["x-ledig-signature"] = "v1=" + createHmac("sha256", required("LEDIG_API_SECRET"))
              .update(payload).digest("base64");

            const response = await fetch(`${baseUrl}${pathWithQuery}`, {
              method,
              headers,
              body: rawBody,
            });
            const result = await response.json();
            // Use result in your application; do not log credentials or upload links.
            console.log(response.status);
  /v1/managed-businesses/{businessId}/onboarding/share/{sessionId}:
    parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
        example: business_example_001
      - $ref: "#/components/parameters/SelectedBusinessId"
      - $ref: "#/components/parameters/ActingBusinessId"
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
        example: 22222222-2222-4222-8222-222222222222
    delete:
      tags:
        - Managed businesses
      operationId: revokeManagedOnboardingShare
      summary: Revoke an onboarding link
      description: Stop access through an onboarding link and any sessions opened from it.
      security:
        - BearerAuth: []
        - LedigApiKey: []
          LedigTimestamp: []
          LedigSignature: []
      responses:
        "200":
          description: Link revoked.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Referrer-Policy:
              schema:
                type: string
              description: no-referrer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - revoked
                        properties:
                          revoked:
                            const: true
              example:
                status: success
                data:
                  revoked: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: merchants:write
      x-mint:
        content: |-
          **Required scope:** `merchants:write`

          Use your institution's credentials and keep your institution selected in the business headers. The businessId in the path identifies the business whose application you manage. Your institution must have managed-business access and an active relationship with that business. You can complete its application before that business is approved. Repeating this request for the same revoked link is safe. Your institution can continue managing the application through its own dashboard or API access.
