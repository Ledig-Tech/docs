                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: recipient_read
      x-mint:
        content: |-
          **Required scope:** `recipient_read`

          Returns one recipient, including its current `reviewStatus`. Use it to check whether a destination has been approved before creating a quote that pays out to it.
    delete:
      tags:
        - Recipients
      operationId: deleteRecipient
      summary: Delete a recipient
      description: Removes a recipient from future payouts.
      responses:
        "200":
          description: Recipient removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: recipient_manage
      x-mint:
        content: |-
          **Required scope:** `recipient_manage`

          Removes a recipient so it can no longer be used for a payout. The operation is a soft delete; the payout history that references the destination is retained. The response returns the deleted recipient.
  /v1/quotes/payment-options:
    get:
      tags:
        - Payment options
      operationId: listQuotePaymentOptions
      summary: List payment options
      description: Lists the payout methods, fees and limits for a currency.
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum:
              - deposit
              - withdraw
        - in: query
          name: currency
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: amount
          required: false
          schema:
            type: string
            pattern: ^(?=.*[1-9])(0|[1-9]\d*)(?:\.\d+)?$
        - in: query
          name: chain
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Crypto network for business-aware payout fee discovery.
        - in: query
          name: recipientId
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Business-owned recipient for withdrawal option filtering. Not accepted for deposit discovery.
      responses:
        "200":
          description: Eligible deposit or withdrawal payment options.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PaymentOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: quotes:read
      x-mint:
        content: |-
          **Required scope:** `quotes:read`

          Lists the payout or collection methods enabled for a currency, with their fees, limits and stable `paymentMethodIds`. Pass one of those IDs in a quote's `payOut`. Use `type=withdraw` for payouts and `type=deposit` for collection options. Supply `amount` to exclude options whose limits do not cover it.
  /v1/quotes:
    post:
      tags:
        - Quotes
      operationId: createQuote
      summary: Create an executable quote
      description: Prices a conversion or payout and fixes the terms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Quote created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid request, unsupported amount precision or invalid provider mobile network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                amountPrecision:
                  summary: A zero-decimal currency received a non-zero fractional amount.
                  value:
                    status: error
                    code: BAD_REQUEST
                    message: Amount exceeds the currency's 0-decimal precision.
                mobileNetwork:
                  summary: Illustrative accepted values; the actual list comes from the country's provider catalogue.
                  value:
                    status: error
                    code: PROVIDER_NETWORK_INVALID
                    message: "Mobile-money network is invalid for KE. Accepted values: Mpesa."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The selected provider conversion route is unavailable. Missing adapters, fresh capacity or required execution policy fail closed; no fallback global route is substituted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                code: RATE_PROVIDER_CONVERSION_UNAVAILABLE
                message: Conversion is not available for this route.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Required provider data is unavailable or malformed; retry after availability is restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                mobileNetworksUnavailable:
                  value:
                    status: error
                    code: PROVIDER_UNAVAILABLE
                    message: Flutterwave mobile networks could not be verified.
      x-scope: quotes:write
      x-mint:
        content: |-
          **Required scope:** `quotes:write`

          Prices a conversion or payout and fixes the rate, destination amount and expiry. Send `sourceAmount`; the server calculates `destinationAmount`. A same-currency quote must include `payOut`. `payIn` with `temporary_bank_account` is reserved and returns `501`. A quote is single-use and is consumed by `POST /v1/transfers`.
    get:
      tags:
        - Quotes
      operationId: listQuotes
      summary: List quotes
      description: Lists the profile's quotes.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Quote page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: quotes:read
      x-mint:
        content: |-
          **Required scope:** `quotes:read`

          Lists the profile's quotes, newest first by default. Use `limit`, `cursor` and `sort`; the response includes pagination cursors. Quotes are not filtered by status or currency; read a specific quote by ID.
  /v1/quotes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Quotes
      operationId: getQuote
      summary: Get a quote
      description: Reads one quote and its expiry.
      responses:
        "200":
          description: Quote.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: quotes:read
      x-mint:
        content: |-
          **Required scope:** `quotes:read`

          Returns one quote with its amounts, rate, status and `expiresAt`. Use it to confirm the terms before creating a transfer. A quote can be `pending`, `accepted` or `expired`.
  /v1/transfers:
    post:
      tags:
        - Transfers
      operationId: createTransfer
      summary: Create a transfer from a quote
      description: Executes a quote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - quoteId
              properties:
                quoteId:
                  type: string
                reference:
                  type: string
                  maxLength: 64
      responses:
        "201":
          description: Transfer accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Payout USD admission exceeds the effective transaction or monthly cap. When enforcement is enabled, the quote claim and transfer are rolled back before dispatch. Read GET /v1/balances/summary for current allowance; deterministic cap errors are not provider failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutUsdLimitExceededError"
              examples:
                transactionLimit:
                  value:
                    status: error
                    code: PAYOUT_TRANSACTION_LIMIT_EXCEEDED
                    message: This payout exceeds the business transaction limit.
                monthlyLimit:
                  value:
                    status: error
                    code: PAYOUT_MONTHLY_LIMIT_EXCEEDED
                    message: This payout exceeds the business monthly allowance.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: A required provider, policy store or indicative rate is unavailable. RATE_AUTHORITATIVE_STORE_UNAVAILABLE means a usable USD admission valuation could not be established; no transfer or quote claim is committed by a failed admission.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
                    type: string
                    const: error
                  code:
                    type: string
                  message:
                    type: string
              example:
                status: error
                code: RATE_AUTHORITATIVE_STORE_UNAVAILABLE
                message: A current indicative USD valuation is unavailable.
      x-scope: transfers:write
      x-mint:
        content: |-
          **Required scope:** `transfers:write`

          Executes a quote. The quote must be pending, unexpired and owned by the profile, and the source balance must cover the amount. The quote is consumed in the same transaction that creates the transfer, so it cannot be used twice. There is no idempotency key on this route; if the create response is lost, contact support with the quote ID before retrying.
  /v1/transfers/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Transfers
      operationId: getTransfer
      summary: Get a transfer
      description: Reads one transfer and its current status.
      responses:
        "200":
          description: Transfer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Transfer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transfers:read
      x-mint:
        content: |-
          **Required scope:** `transfers:read`

          Returns one transfer with its current status and a customer-safe `failureReason`. Poll this route to follow execution. A payout may also carry an `approval` state while it waits for review. There is no list route; use transactions for history.
  /v1/transactions:
    get:
      tags:
        - Transactions
      operationId: listTransactions
      summary: List transactions
      description: Reads the customer transaction history.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: currency
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: reference
          schema:
            type: string
        - in: query
          name: isCredit
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - in: query
          name: isFiat
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - in: query
          name: period
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - 1y
        - in: query
          name: from
          schema:
            type: string
        - in: query
          name: to
          schema:
            type: string
      responses:
        "200":
          description: Transaction page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transactions:read
      x-mint:
        content: |-
          **Required scope:** `transactions:read`

          Returns the profile's customer transaction history. Filter by status, currency, category, type, reference, direction (`isCredit`) or rail (`isFiat`), or use `period`/`from`/`to`. Results are cursor-paginated. Amounts are decimal strings and `isCredit` gives the direction.
  /v1/transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Transactions
      operationId: getTransaction
      summary: Get a transaction
      description: Reads one customer transaction.
      responses:
        "200":
          description: Transaction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-scope: transactions:read
      x-mint:
        content: |-
          **Required scope:** `transactions:read`

          Returns one customer transaction. Use it after a transfer to read the customer-facing record. Ledger references and internal versions are not part of the public contract.
components:
  schemas:
    Success:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: success
        message:
          type: string
    CurrencyCatalogEntry:
      type: object
      additionalProperties: true
      description: Currency catalogue entry with its supported networks.
      required:
        - code
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - fiat
            - crypto
        status:
          type: string
        description:
          type:
            - string
            - "null"
        decimal:
          type:
            - integer
            - "null"
        addressRegex:
          type:
            - string
            - "null"
        networks:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - chain
              - name
              - addressRegex
              - status
            properties:
              chain:
                type: string
              name:
                type: string
              addressRegex:
                type:
                  - string
                  - "null"
              status:
                type: string
    IndicativeRate:
      type: object
      additionalProperties: false
      description: Indicative rate row in the compatibility shape.
      required:
        - Base Currency
        - Quote Currency
        - Bid
        - Ask
        - "Last Updated "
      properties:
        Base Currency:
          type: string
        Quote Currency:
          type: string
        Bid:
          type: number
        Ask:
          type: number
        "Last Updated ":
          type: string
    Balance:
      type: object
      additionalProperties: true
      description: Ledger balance for one currency.
      required:
        - currency
      properties:
        currency:
          type: string
        available:
          type: string
        reserved:
          type: string
    Wallet:
      type: object
      additionalProperties: true
      description: Crypto deposit address.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        nickname:
          type: string
        coin:
          type: string
        network:
          type: string
        address:
          type: string
        memo:
          type:
            - string
            - "null"
        createdAt:
          type: string
    VirtualAccount:
      type: object
      additionalProperties: true
      description: Fiat receiving account.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        currencyCode:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        bankCode:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        createdAt:
          type: string
        updatedAt:
          type: string
    CreateRecipientRequest:
      type: object
      additionalProperties: false
      required:
        - currency
        - type
      allOf:
        - if:
            properties:
              type:
                const: ledig
            required:
              - type
          else:
            required:
              - country
            properties:
              country:
                type: string
                minLength: 1
      properties:
        currency:
          type: string
        country:
          type: string
        type:
          type: string
        fields:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
        legalEntityType:
          type: string
          enum:
            - individual
            - business
          description: Required by updated non-ZAR fiat bank/mobile requirements. Individual requires firstName and lastName, with optional middleName; business requires businessName in fields.
        bankDetailsSource:
          type: string
          enum:
            - directory
            - manual
          description: Manual bank entry is accepted only where the requirement advertises it and derives an immutable Ledig-only payout restriction. ZAR is excluded.
        oneTime:
          type: boolean
    Recipient:
      type: object
      additionalProperties: true
      description: Saved payout destination.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        currency:
          type: string
        country:
          type: string
        type:
          type: string
        recipientRequirementId:
          type: string
        legalEntityType:
          type: string
          enum:
            - individual
            - business
        bankDetailsSource:
          type: string
          enum:
            - directory
            - manual
        payoutExecutionRestriction:
          type: string
          enum:
            - ledig_only
          readOnly: true
          description: Server-derived recipient restriction. The client cannot clear it or select provider execution for this destination.
        requirement:
          type:
            - object
            - "null"
          additionalProperties: false
          description: Owning requirement metadata for this saved destination, including hidden or inactive definitions. Null when unavailable; older deployments may omit it. Empty currencies means no currency restriction. This does not establish recipient approval, provider support or payout eligibility.
          required:
            - name
            - category
            - type
            - currencies
          properties:
            name:
              type: string
            category:
              type: string
            type:
              type: string
            currencies:
              type: array
              items:
                type: string
        fields:
          type: object
          additionalProperties:
            type: string
        reviewStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - revoked
          description: Review state for this saved destination. Approval applies only to its current destination version.
        createdAt:
          type: string
        updatedAt:
          type: string
        active:
          type: boolean
        oneTime:
          type: boolean
    CursorPage:
      allOf:
        - $ref: "#/components/schemas/Success"
        - type: object
          required:
            - data
            - pagination
          properties:
            pagination:
              type: object
              properties:
                nextCursor:
                  type: string
                previousCursor:
                  type: string
    PaymentOption:
      type: object
      additionalProperties: false
      required:
        - channel
        - name
        - description
        - currency
        - paymentMethodIds
        - minimumFee
        - maximumFee
        - minimumAmount
        - maximumAmount
        - supportConversion
        - invoiceRequired
      properties:
        channel:
          type: string
        name:
          type: string
        description:
          type: string
        currency:
          type: string
        paymentMethodIds:
          type: array
          items:
            type: string
        minimumFee:
          type: string
        maximumFee:
          type: string
        minimumAmount:
          type: string
        maximumAmount:
          type: string
        supportConversion:
          type: boolean
        executionMode:
          type: string
          enum:
            - provider
            - ledig
          description: Withdrawal execution mode. Manual-bank recipients require an eligible ledig option; the backend enforces the saved recipient restriction again at payout admission.
        invoiceRequired:
          type: boolean
          default: false
          description: Whether all methods in this option require an invoice document. This never makes transferPurpose mandatory.
        feeQuoteRequired:
          type: boolean
          description: True when discovery lacks context or fee pricing cannot price this option yet (currency, payment method or network not configured); obtain a final quote before confirmation.
        feeQuotes:
          type: array
          description: Business-aware per-method discovery; the executable quote remains authoritative.
          items:
            type: object
            additionalProperties: false
            required:
              - paymentMethodId
              - feeAmount
              - feeCurrency
            properties:
              paymentMethodId:
                type: string
              feeAmount:
                type: string
              feeCurrency:
                type: string
              chain:
                type: string
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - sourceCurrency
        - destinationCurrency
        - sourceAmount
      properties:
        reference:
          type: string
          maxLength: 64
        sourceCurrency:
          type: string
          minLength: 2
          maxLength: 20
        destinationCurrency:
          type: string
          minLength: 2
          maxLength: 20
        sourceAmount:
          type: string
          description: Positive decimal amount within sourceCurrency's configured precision. Excess fractional zeroes are accepted; non-zero excess digits are rejected without rounding. Zero-decimal currencies accept 10 or 10.000 but reject 10.1.
        payIn:
          type: object
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              const: temporary_bank_account
        payOut:
          type: object
          additionalProperties: false
          required:
            - type
            - recipientId
            - paymentMethodId
          properties:
            type:
              type: string
              enum:
                - fiat
                - crypto
                - ledig
            recipientId:
              type: string
            paymentMethodId:
              type: string
            chain:
              type: string
            narration:
              type: string
            transferPurpose:
              type: string
              minLength: 1
              maxLength: 100
              description: Optional internal Ledig classification. Recommended dropdown values come from GET /v1/quotes/transfer-purposes and include Other. Existing free-text values remain accepted. Provider instruction mapping belongs to the adapter.
            invoiceDocumentId:
              allOf:
                - $ref: "#/components/schemas/PayoutDocumentId"
              description: Optional uploaded invoice reference. Required only when the selected payment option declares invoiceRequired. Must resolve to a verified object owned by the effective financial profile.
    Quote:
      type: object
      additionalProperties: true
      description: Executable pricing terms and expiry.
      required:
        - id
      properties:
        id:
          type: string
        feeAmount:
          type: string
          description: Exact source-currency conversion fee, rounded once to source precision. Zero for legacy or zero-fee quotes.
        feeCurrency:
          type: string
          description: Source currency in which the conversion fee is charged.
        sourceDebitAmount:
          type: string
          description: Source principal plus conversion fee only; retained compatibility meaning. Use totalSourceDebitAmount for Quick Send.
        payoutFeeAmount:
          type: string
          description: Accepted payout fee in payoutFeeCurrency; its actual source charge is payoutFeeSourceAmount.
        payoutFeeCurrency:
          type: string
          description: Destination/payout currency.
        payoutFeeSourceAmount:
          type: string
          description: Accepted payout fee actually charged in source currency; zero for historical or conversion-only quotes.
        totalFeeAmount:
          type: string
          description: Conversion fee plus payoutFeeSourceAmount, in source currency. Use for Quick Send total fees.
        totalFeeCurrency:
          type: string
          description: Source currency used for combined fees.
        totalSourceDebitAmount:
          type: string
          description: Source principal plus both customer fees. Recipient proceeds are unchanged.
        profileId:
          type: string
        sourceCurrency:
          type: string
        destinationCurrency:
          type: string
        sourceAmount:
          type: string
        destinationAmount:
          type: string
        rate:
          type: string
        expiresAt:
          type: string
        status:
          type: string
        reference:
          type: string
        createdAt:
          type: string
    Error:
      type: object
      required:
        - status
        - message
        - code
      properties:
        status:
          type: string
          const: error
        message:
          type: string
        code:
          type: string
    Transfer:
      type: object
      additionalProperties: true
      description: Transfer execution record and status.
      required:
        - id
      properties:
        approval:
          type:
            - object
            - "null"
          additionalProperties: false
          description: Payout review status returned by transfer detail when applicable. The reason is customer-safe; internal staff decisions and identities are not exposed.
          required:
            - status
            - version
            - reason
          properties:
            status:
              type: string
              enum:
                - pending
                - approved
                - rejected
                - expired
                - executing
            version:
              type: integer
              minimum: 1
            reason:
              type:
                - string
                - "null"
        id:
          type: string
        feeAmount:
          type: string
          description: Exact source-currency conversion fee, rounded once to source precision. Zero for legacy or zero-fee quotes.
        feeCurrency:
          type: string
          description: Source currency in which the conversion fee is charged.
        sourceDebitAmount:
          type: string
          description: Source principal plus conversion fee only; retained compatibility meaning. Use totalSourceDebitAmount for Quick Send.
        payoutFeeAmount:
          type: string
          description: Accepted payout fee in payoutFeeCurrency; its actual source charge is payoutFeeSourceAmount.
        payoutFeeCurrency:
          type: string
          description: Destination/payout currency.
        payoutFeeSourceAmount:
          type: string
          description: Accepted payout fee actually charged in source currency; zero for historical or conversion-only quotes.
        totalFeeAmount:
          type: string
          description: Conversion fee plus payoutFeeSourceAmount, in source currency. Use for Quick Send total fees.
        totalFeeCurrency:
          type: string
          description: Source currency used for combined fees.
        totalSourceDebitAmount:
          type: string
          description: Source principal plus both customer fees. Recipient proceeds are unchanged.
        profileId:
          type: string
        quoteId:
          type: string
        status:
          type: string
        reference:
          type: string
        createdAt:
          type: string
        sourceCurrency:
          type: string
        destinationCurrency:
          type: string
        sourceAmount:
          type: string
        destinationAmount:
          type: string
        rate:
          type: string
        failureReason:
          type:
            - string
            - "null"
        updatedAt:
          type: string
    PayoutUsdLimitExceededError:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          enum:
            - PAYOUT_TRANSACTION_LIMIT_EXCEEDED
            - PAYOUT_MONTHLY_LIMIT_EXCEEDED
        message:
          type: string
    Transaction:
      type: object
      additionalProperties: true
      description: Customer transaction record.
      required:
        - id
      properties:
        id:
          type: string
        profileId:
          type: string
        type:
          type: string
        status:
          type: string
        amount:
          type: string
        currency:
          type: string
        reference:
          type: string
        createdAt:
          type: string
        category:
          type: string
        description:
          type: string
        isCredit:
          type: boolean
        isFiat:
          type: boolean
    PayoutDocumentId:
      type: string
      pattern: ^pdoc_[A-Za-z0-9_-]{24}$
      description: Opaque, profile-scoped invoice document reference. Never an S3 URL or object key.
  responses:
    Unauthorized:
      description: Missing, invalid or expired credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Inactive account, missing profile or missing scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: A request or new-work allowance is exhausted. Wait before retrying; preserve the same idempotency key for a write.
      headers:
        Retry-After:
          description: Seconds until the exhausted allowance can be retried.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          description: Application responses use private, no-store; AWS edge responses use no-store.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: An authoritative dependency (database or provider) is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      description: Required on state-changing requests that call a provider or post to the ledger.
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum:
          - asc
          - desc
  securitySchemes:
    LedigApiKey:
      type: apiKey
      in: header
      name: x-ledig-key
      description: Public business API-key identifier.
    LedigTimestamp:
      type: apiKey
      in: header
      name: x-ledig-timestamp
      description: Current Unix timestamp in seconds.
    LedigSignature:
      type: apiKey
      in: header
      name: x-ledig-signature
      description: HMAC-SHA256 signature prefixed with v1= for existing own-business/legacy selection, or v2= for header-bound managed-business delegation. See the Authentication section for exact canonical payloads.
