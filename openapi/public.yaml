          pattern: ^[A-Z0-9]{2,12}$
        available:
          type: string
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          description: Exact balance decimal string. Negative balances remain negative in the estimate.
        reserved:
          type: string
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          description: Exact balance decimal string. Negative balances remain negative in the estimate.
        total:
          type: string
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          description: Exact balance decimal string. Negative balances remain negative in the estimate.
        estimatedTotalUsd:
          anyOf:
            - type: string
              pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Signed estimated USD value, rounded to cents.
            - type: "null"
        estimatedAvailableUsd:
          anyOf:
            - type: string
              pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Signed estimated USD value, rounded to cents.
            - type: "null"
        estimatedReservedUsd:
          anyOf:
            - type: string
              pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Signed estimated USD value, rounded to cents.
            - type: "null"
        valuationStatus:
          type: string
          enum:
