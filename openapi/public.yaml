                  type: string
    PaymentOption:
      type: object
      additionalProperties: false
      required:
        - channel
        - name
        - description
        - currency
        - paymentMethodIds
        - minimumFee
        - maximumFee
        - minimumAmount
        - maximumAmount
        - supportConversion
        - invoiceRequired
      properties:
        channel:
          type: string
        name:
          type: string
        description:
          type: string
        currency:
          type: string
        paymentMethodIds:
          type: array
          items:
            type: string
        minimumFee:
          type: string
        maximumFee:
          type: string
        minimumAmount:
          type: string
        maximumAmount:
          type:
            - string
            - "null"
          description: Null means no crypto payout route maximum; requires a zero minimum. Fiat remains bounded.
        supportConversion:
          type: boolean
        executionMode:
          type: string
          enum:
            - provider
            - ledig
          description: Withdrawal execution mode. Manual-bank recipients require an eligible ledig option; the backend enforces the saved recipient restriction again at payout admission.
        invoiceRequired:
          type: boolean
          default: false
          description: Whether all methods in this option require an invoice document. This never makes transferPurpose mandatory.
        feeQuoteRequired:
          type: boolean
          description: True when discovery lacks context or fee pricing cannot price this option yet (currency, payment method or network not configured); obtain a final quote before confirmation.
        deliveryOptions:
          type: array
          description: Authoritative customer delivery choices. Empty when no eligible unambiguous route exists. Legacy names and paymentMethodIds remain compatible, but new clients must use these choices. Recipient types refer to requirement.type categories, not requirement IDs.
          items:
            type: object
            additionalProperties: false
            required:
              - paymentMethodId
              - channel
              - label
              - recipientTypes
            properties:
              paymentMethodId:
                type: string
              channel:
                type: string
              label:
                type: string
                description: Customer display label. The internal `ledig` method is labelled "Send via the Ledig network"; ids never change with wording.
              description:
                type: string
                maxLength: 160
                description: Optional plain-text explanation for customer screens (for `ledig`, "Send to another Ledig business using its business ID.").
              chain:
                type: string
                description: Exact execution key; submit unchanged on quotes. feeChain separately identifies matching fee rows.
              canonicalNetwork:
                type: string
                description: Canonical shared network identity for matching recipient destinationScope.network. Mainnet aliases never refer to Sepolia.
              networkName:
                type: string
              recipientTypes:
                type: array
                items:
                  type: string
              feeChain:
                type: string
                description: Exact fee identity, which may be a retained alias for the same canonical network. Not a replacement execution key.
              testnet:
                type: boolean
        feeQuotes:
          type: array
          description: Business-aware per-method discovery; the executable quote remains authoritative.
          items:
            type: object
            additionalProperties: false
            required:
              - paymentMethodId
              - feeAmount
              - feeCurrency
            properties:
              paymentMethodId:
                type: string
              feeAmount:
                type: string
              feeCurrency:
                type: string
              chain:
                type: string
    PayoutFeeCatalogue:
