            const documentMimeType = required("LEDIG_DOCUMENT_MIME_TYPE");
            const documentChecksum = required("LEDIG_DOCUMENT_SHA256");
            const documentSizeBytes = Number(required("LEDIG_DOCUMENT_SIZE_BYTES"));
