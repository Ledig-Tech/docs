    CustomerPayoutUsdAllowance:
      type: object
      additionalProperties: false
      required:
        - scope
        - segment
        - transactionLimitUsd
        - monthlyLimitUsd
        - usedUsd
        - reservedUsd
        - remainingUsd
        - periodStart
        - resetsAt
        - timezone
        - enforcementEnabled
      properties:
        scope:
          type: string
          const: parent_business
        segment:
          type: string
          enum:
            - standard
            - institutional
        transactionLimitUsd:
          anyOf:
            - type: string
              pattern: ^(?:0|[1-9]\d{0,27})(?:\.\d{1,2})?$
            - type: "null"
          description: The USD principal cap per payment. Null means unlimited; zero prevents new positive payouts when enforcementEnabled is true.
        monthlyLimitUsd:
          anyOf:
            - type: string
              pattern: ^(?:0|[1-9]\d{0,27})(?:\.\d{1,2})?$
            - type: "null"
          description: The monthly USD principal cap. Null means unlimited; zero prevents new positive payouts when enforcementEnabled is true.
        usedUsd:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d{1,2})?$
          description: Exact nonnegative USD decimal string. Use decimal arithmetic for financial calculations.
        reservedUsd:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d{1,2})?$
          description: Exact nonnegative USD decimal string. Use decimal arithmetic for financial calculations.
        remainingUsd:
          anyOf:
            - type: string
              pattern: ^(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Exact nonnegative USD decimal string. Use decimal arithmetic for financial calculations.
            - type: "null"
        periodStart:
          type: string
          format: date-time
        resetsAt:
          type: string
          format: date-time
        timezone:
          type: string
          const: UTC
        enforcementEnabled:
          type: boolean
          description: Whether these USD payout limits are currently applied when creating a payment.
