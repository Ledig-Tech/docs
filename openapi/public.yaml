  /v1/quotes:
    post:
      tags:
        - Quotes
      operationId: createQuote
      summary: Create a conversion or payment quote
      description: Confirm the rate, fees, destination amount and expiry before sending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
            example:
              sourceCurrency: USDT
              destinationCurrency: USD
              sourceAmount: "100.00"
              reference: invoice-example-001
      responses:
        "201":
          description: Quote created or the original quote recovered. replayed distinguishes an existing result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                      - replayed
                    properties:
                      replayed:
                        type: boolean
                        description: True when the original resource is returned without creating another operation.
                      data:
                        $ref: "#/components/schemas/ClientQuote"
              example:
                status: success
                data:
                  id: quote_example_001
                  profileId: profile_example_001
                  reference: invoice-example-001
                  sourceCurrency: USDT
                  destinationCurrency: USD
                  sourceAmount: "100.00"
                  destinationAmount: "100.00"
                  rate: "1.00"
                  createdAt: 2026-01-15T10:00:00.000Z
                  updatedAt: 2026-01-15T10:00:00.000Z
                  feeAmount: "0.50"
                  feeCurrency: USDT
                  sourceDebitAmount: "100.50"
                  payoutFeeAmount: "0"
                  payoutFeeCurrency: USD
                  payoutFeeSourceAmount: "0"
                  totalFeeAmount: "0.50"
                  totalFeeCurrency: USDT
                  totalSourceDebitAmount: "100.50"
                  meta:
                    rate:
                      product: USDTUSD
                      sourceCurrency: USDT
                      destinationCurrency: USD
                      rate: "1.00"
                      side: sell
                      type: fixed
                  expiresAt: 2026-01-15T10:05:00.000Z
                  status: pending
                replayed: false
        "400":
          description: Invalid request, too many decimal places or an unsupported mobile money network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingRecipient:
                  value:
                    status: error
                    code: BAD_REQUEST
                    message: payOut.recipientId is required.
                amountPrecision:
                  summary: A zero-decimal currency received a non-zero fractional amount.
                  value:
                    status: error
                    code: BAD_REQUEST
                    message: Amount exceeds the currency's 0-decimal precision.
                mobileNetwork:
                  summary: Example network choices. Use a supported mobile money network for the destination country.
                  value:
                    status: error
                    code: PROVIDER_NETWORK_INVALID
                    message: "Mobile-money network is invalid for KE. Accepted values: Mpesa."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No active conversion route or executable price exists for the requested currency direction. A missing recipient or payout method can also return NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                priceUnavailable:
                  value:
                    status: error
                    code: RATE_NOT_FOUND
                    message: A price is currently unavailable for this pair. Try again later.
        "409":
          description: The source balance cannot cover the amount and fees (INSUFFICIENT_BALANCE), the conversion is unavailable, pricing conflicts, or your conversion allowance is exceeded. INSTANT_CONVERSION_LIMIT_EXCEEDED includes daily or monthly allowance details in the source currency. Resolve the reported cause before requesting another quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                insufficientBalance:
                  value:
                    status: error
                    code: INSUFFICIENT_BALANCE
                    message: Available balance is not sufficient for this action.
                conversionUnavailable:
                  value:
                    status: error
                    code: RATE_PROVIDER_CONVERSION_UNAVAILABLE
                    message: Conversion is not available for this route.
        "422":
          description: The amount is outside this conversion's limits (RATE_ROUTE_AMOUNT_OUT_OF_RANGE), the amount cannot currently be converted (RATE_ROUTE_CAPACITY_EXCEEDED), or the rate is not currently available for a confirmed quote. Range details use the source currency. A displayed conversion or rate is checked again when you create the quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                conversionAmountOutsideRange:
                  value:
                    status: error
                    code: RATE_ROUTE_AMOUNT_OUT_OF_RANGE
                    message: The amount you convert must be between 10 and 50000 USDT for this conversion direction.
                    details:
                      sourceCurrency: USDT
                      minimumAmount: "10"
                      maximumAmount: "50000"
                conversionAmountUnavailable:
                  value:
                    status: error
                    code: RATE_ROUTE_CAPACITY_EXCEEDED
                    message: The requested conversion amount is not currently available. Try a smaller amount or try again later.
                expiredPrice:
                  value:
                    status: error
                    code: RATE_EXPIRED
                    message: This price has expired. Request a new quote.
        "423":
          description: "COMPLIANCE_REVIEW_REQUIRED: this payment needs review before it can proceed. Check its status or contact support@ledig.io."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: error
                code: COMPLIANCE_REVIEW_REQUIRED
                message: This action requires a review before it can continue.
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          description: temporary_bank_account is not currently supported for payIn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
