      x-scope: balances:read
      x-mint:
        content: |-
          **Required scope:** `balances:read`

          Returns one balance per currency held by the active profile. `available` is free to use; `reserved` is held for an in-flight operation. Amounts are decimal strings. Use `GET /v1/balances/{currency}` when you only need one currency.
  /v1/balances/{currency}:
    parameters:
