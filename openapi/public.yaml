  /v1/managed-businesses/applications:
    parameters:
      - $ref: "#/components/parameters/SelectedBusinessId"
      - $ref: "#/components/parameters/ActingBusinessId"
      - in: header
        name: Idempotency-Key
        required: true
        description: A unique key for this application request. Reuse it for retries; changing the request with the same key returns 409.
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: example-request-001
    post:
      tags:
        - Managed businesses
      operationId: createParentManagedStandardBusiness
      summary: Start a business application
      description: Create an onboarding application for a business you manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedBusinessApplicationInput"
            example:
              businessName: Example Supplies Ltd
      responses:
        "202":
          description: Application and managed business created or resumed. Includes requestId, applicationId and businessId; no credentials.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedBusinessInvitationResult"
              example:
                status: success
                data:
                  status: accepted
                  requestId: application_request_example_001
                  applicationId: application_example_001
                  businessId: business_example_001
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-scope: merchants:write
      x-mint:
        content: |-
          **Required scope:** `merchants:write`

          Select your institution in the business headers and send businessName with an Idempotency-Key. Reuse the same key and name when retrying; a changed request returns 409. The response includes the application and business IDs. Add contact, company and ownership details through the application's sections. You can complete the application yourself or create an onboarding link for the applicant. Creating the application does not send an email or signup invitation.
      x-codeSamples:
        - lang: javascript
          label: Node.js
          source: |-
            import { createHmac } from "node:crypto";

            // Node.js 18+. Set credentials and resource values on your server.
            function required(name) {
              const value = process.env[name];
              if (!value) throw new Error(`Set ${name} before running this example.`);
              return value;
            }

            const baseUrl = process.env.LEDIG_API_BASE_URL ?? "https://api-sandbox.ledig.io";
            const method = "POST";
            const path = `/v1/managed-businesses/applications`;
            const pathWithQuery = path;
            const body = {
              "businessName": "Example Supplies Ltd"
            };
            const rawBody = JSON.stringify(body);
            const headers = { "Accept": "application/json" };
            headers["Content-Type"] = "application/json";
            // Keep this value and the same body when retrying this request.
            headers["Idempotency-Key"] = required("LEDIG_IDEMPOTENCY_KEY");
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const payload = `${timestamp}.${method}.${pathWithQuery}.${rawBody}`;
            headers["x-ledig-key"] = required("LEDIG_API_KEY");
            headers["x-ledig-timestamp"] = timestamp;
            headers["x-ledig-signature"] = "v1=" + createHmac("sha256", required("LEDIG_API_SECRET"))
              .update(payload).digest("base64");

            const response = await fetch(`${baseUrl}${pathWithQuery}`, {
              method,
              headers,
              body: rawBody,
            });
            const result = await response.json();
            // Use result in your application; do not log credentials or upload links.
            console.log(response.status);
