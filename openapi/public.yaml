            - total
            - available
            - reserved
          properties:
            total:
              type: string
              pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Signed estimated USD value for balances that could be valued, rounded to cents.
            available:
              type: string
              pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Signed estimated USD value for balances that could be valued, rounded to cents.
            reserved:
              type: string
              pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,2})?$
              description: Signed estimated USD value for balances that could be valued, rounded to cents.
        balances:
          type: array
          items:
            $ref: "#/components/schemas/EstimatedUsdCurrencyBalance"
        payoutAllowance:
          $ref: "#/components/schemas/CustomerPayoutUsdAllowance"
    ClientWallet:
      type: object
      additionalProperties: false
      description: A crypto deposit address and any memo required when sending funds.
      required:
        - id
        - profileId
        - nickname
        - coin
        - network
        - address
        - memo
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        profileId:
          type: string
        nickname:
          type: string
        coin:
          type: string
        network:
          type: string
        address:
          type: string
        memo:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    CryptoNetworkOptions:
      type: object
      additionalProperties: false
      required:
        - networks
      properties:
        networks:
          type: array
          items:
            $ref: "#/components/schemas/CryptoNetworkOption"
    CreateNetworkWalletRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
        - network
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 255
        network:
          type: string
          minLength: 1
          description: A network ID returned by GET /v1/wallets/options.
        memo:
          type: string
    NetworkWalletResult:
      type: object
      additionalProperties: false
      required:
        - requestId
        - status
        - network
        - address
        - supportedAssets
        - wallets
      properties:
        requestId:
          type: string
          description: The ID to use when checking this business's deposit address setup.
        status:
          type: string
          enum:
            - ready
            - pending
        network:
          type: string
        address:
          type:
            - string
            - "null"
