                    monthlyLimitUsd: "100000"
                    usedUsd: "20000"
                    reservedUsd: "5000"
                    remainingUsd: "75000"
                    periodStart: 2026-10-01T00:00:00.000Z
                    resetsAt: 2026-11-01T00:00:00.000Z
                    timezone: UTC
                    enforcementEnabled: false
        "400":
          description: Invalid request, unknown query parameter or malformed identifier.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - code
                  - message
                properties:
                  status:
