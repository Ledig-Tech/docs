        - amount
      properties:
        currency:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9]{1,11}$
        payoutType:
          type: string
          enum:
            - fiat
            - crypto
        amount:
          type: string
          pattern: ^(?:0|[1-9]\d{0,18})(?:\.\d{1,18})?$
          description: A positive amount using no more than the selected currency's supported decimal places.
        network:
          type: string
          minLength: 1
          maxLength: 100
          description: The exact network ID for a crypto payout. Omit for bank or mobile money payouts.
        bandId:
          type: string
          pattern: ^pbd_[a-f0-9]{32}$
    PayoutCustomerFeeEstimate:
      type: object
      additionalProperties: false
      required:
        - pricedAt
        - currency
        - payoutType
        - amount
        - amountWithinLimits
        - pricing
        - payoutAvailability
      properties:
        pricedAt:
          type: string
          format: date-time
        currency:
          type: string
        payoutType:
          type: string
          enum:
            - fiat
            - crypto
        canonicalNetwork:
          type: string
        amount:
          type: string
        bandId:
          type: string
          pattern: ^pbd_[a-f0-9]{32}$
        minimumAmount:
          type: string
        maximumAmount:
          type:
            - string
            - "null"
          description: The maximum payout amount. Null means this crypto option has no maximum and its minimum must be zero. Bank and mobile money options have a maximum.
        amountWithinLimits:
          type: boolean
        pricing:
          oneOf:
            - $ref: "#/components/schemas/PayoutCustomerFeeEstimateAvailable"
            - $ref: "#/components/schemas/PayoutCustomerFeeUnavailable"
        payoutAvailability:
          $ref: "#/components/schemas/PayoutCatalogueAvailability"
    CustomerPayoutFeeScheduleRow:
      type: object
      additionalProperties: false
      required:
        - id
        - currency
        - payoutType
        - methodName
        - feeDescription
      properties:
        id:
          type: string
          description: A stable reference for displaying this fee row. Do not use it as a payment method ID.
        currency:
          type: string
        payoutType:
          type: string
          enum:
            - fiat
            - crypto
            - ledig
        methodName:
          type: string
        networkName:
          type: string
        feeDescription:
          type: string
          description: Your current fixed and percentage fees, limits and any business pricing adjustments. Create a quote to confirm the fee for your payment.
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - sourceCurrency
        - destinationCurrency
        - sourceAmount
      properties:
        reference:
          type: string
          maxLength: 64
        sourceCurrency:
          type: string
          minLength: 2
          maxLength: 20
        destinationCurrency:
          type: string
          minLength: 2
          maxLength: 20
        sourceAmount:
          type: string
          description: A positive decimal amount within sourceCurrency's supported precision. Extra trailing zeroes are accepted, but extra non-zero decimal places are rejected without rounding. For a zero-decimal currency, 10 and 10.000 are accepted; 10.1 is rejected.
        payIn:
          type: object
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              const: temporary_bank_account
        payOut:
          type: object
          additionalProperties: false
          required:
            - type
            - paymentMethodId
          description: Use recipientId for a saved destination. To pay another Ledig business, use businessId without saving a recipient. Existing ledig payments using recipientId remain supported; use businessId for new integrations. Business names are looked up by Ledig and are not accepted here.
          oneOf:
            - properties:
                type:
                  enum:
                    - fiat
                    - crypto
              required:
                - recipientId
              not:
                required:
                  - businessId
            - properties:
                type:
                  const: ledig
                paymentMethodId:
                  const: ledig
              required:
                - businessId
              not:
                anyOf:
                  - required:
                      - recipientId
                  - required:
                      - chain
            - deprecated: true
              properties:
                type:
                  const: ledig
                paymentMethodId:
                  const: ledig
              required:
                - recipientId
              not:
                anyOf:
                  - required:
                      - businessId
                  - required:
                      - chain
          properties:
            type:
              type: string
              enum:
                - fiat
                - crypto
                - ledig
            recipientId:
              type: string
            businessId:
              type: string
              minLength: 1
              maxLength: 200
            paymentMethodId:
              type: string
            chain:
              type: string
            narration:
              type: string
            transferPurpose:
              type: string
              minLength: 1
              maxLength: 100
              description: An optional description of why you are sending the payment. Free-text values are accepted.
            invoiceDocumentId:
              allOf:
                - $ref: "#/components/schemas/PayoutDocumentId"
              description: A verified invoice document uploaded by your business. Required only when the chosen payment option has invoiceRequired=true.
