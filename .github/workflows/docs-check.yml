name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard repository content
        run: node scripts/check-docs.mjs

      - name: Install Mintlify CLI
        run: npm install --global mint@latest

      - name: Validate docs
        run: mint validate
