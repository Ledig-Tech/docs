name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          # The report stays temporary. Only locations and rule names reach logs.
          if ! "$scanner_dir/gitleaks" git . --redact=100 --no-banner --log-level error \
            --report-format json --report-path "$scanner_dir/findings.json"; then
            node -e 'const fs=require("node:fs"); const p=process.argv[1]; if(fs.existsSync(p)){for(const x of JSON.parse(fs.readFileSync(p,"utf8"))){console.error(`${x.File}:${x.StartLine}: ${x.RuleID}`)}}else{console.error("repository:1: secret-scan-could-not-complete")}' "$scanner_dir/findings.json"
            exit 1
          fi

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate public content, contracts, rendering and links
        run: npm run check
